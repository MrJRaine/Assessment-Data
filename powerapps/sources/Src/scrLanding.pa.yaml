# ── Direction B restyle (Edge-to-Edge) ──────────────────────────────────────
# Three task cards: Classic/Button = card background + tap target (Navigate kept);
# accent rectangle + icon + title + description + "go" link layered on top, each
# overlay's OnSelect = Select(<card button>) so the whole card is one tap target.
# Card 3 is Student IPPs (the ingest entry was retired — Power Automate path dead).
#
# Resize fix (2026-06-09): cards size responsively — Max(230, half the content
# area) so they (a) always fit the text and (b) cap at ~½ height, leaving room for
# a future second row. Description labels carry an explicit Height (card.Height-160)
# so wrapped text never clips. No AutoHeight (unsupported convention in this app).
#
# Loading-state fix (2026-06-09): EVERY card sub-control (accent rect, icon, all
# labels) is gated Visible: =gblLandingLoaded, not just the card button — otherwise
# the overlays ghost over the "Loading…" label before the user lookup resolves.
#
# Icon enums (Trending / Edit / DocumentWithContent) may need swapping if they
# don't resolve in the target environment.
# ─────────────────────────────────────────────────────────────────────────────
Screens:
  scrLanding:
    Properties:
      Fill: =RGBA(0, 146, 201, 1)
      LoadingSpinnerColor: =RGBA(255, 255, 255, 1)
    Children:
      - recContentPanelLanding:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height - 52
            Width: =Parent.Width
            X: =0
            Y: =52
      - lblLandingHeading:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Lato Black'
            Height: =32
            Size: =17
            Text: ="Reading Assessment"
            Visible: =gblLandingLoaded
            Width: =500
            X: =24
            Y: =14
      - lblLandingWelcome:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            Height: =28
            Size: =13
            Text: ="Welcome back, " & User().FullName
            Visible: =gblLandingLoaded
            Width: =Parent.Width - 48
            X: =24
            Y: =80
      # ── Card 1 · Student Data ──────────────────────────────────────────────
      - btnStudentData:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(228, 234, 237, 1)
            BorderThickness: =1
            Color: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.Lato
            Height: =Max(230, (Parent.Height - 160) / 2)
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(244, 247, 249, 1)
            OnSelect: =Navigate(scrStudentData, ScreenTransition.Fade)
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(230, 244, 250, 1)
            Size: =1
            Text: =""
            Visible: =gblLandingLoaded
            Width: =(Parent.Width - 92) / 3
            X: =24
            Y: =136
      - recEdgeStudentData:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 146, 201, 1)
            Height: =btnStudentData.Height
            OnSelect: =Select(btnStudentData)
            Visible: =gblLandingLoaded
            Width: =4
            X: =btnStudentData.X
            Y: =btnStudentData.Y
      - icoStudentData:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(3, 108, 146, 1)
            Height: =40
            Icon: =Icon.Trending
            OnSelect: =Select(btnStudentData)
            Visible: =gblLandingLoaded
            Width: =40
            X: =btnStudentData.X + 28
            Y: =btnStudentData.Y + 28
      - lblStudentDataTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(24, 43, 52, 1)
            Font: =Font.'Lato Black'
            Height: =30
            OnSelect: =Select(btnStudentData)
            Size: =19
            Text: ="Student Data"
            Visible: =gblLandingLoaded
            Width: =btnStudentData.Width - 56
            X: =btnStudentData.X + 28
            Y: =btnStudentData.Y + 80
      - lblStudentDataDesc:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            Height: =btnStudentData.Height - 160
            OnSelect: =Select(btnStudentData)
            Size: =12
            Text: ="Browse your students with summary charts, then open any student for their full assessment history and progress trend."
            Visible: =gblLandingLoaded
            Width: =btnStudentData.Width - 56
            X: =btnStudentData.X + 28
            Y: =btnStudentData.Y + 116
      - lblStudentDataGo:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(3, 108, 146, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Bold
            Height: =24
            OnSelect: =Select(btnStudentData)
            Size: =12
            Text: ="View & analyze  ›"
            Visible: =gblLandingLoaded
            Width: =btnStudentData.Width - 56
            X: =btnStudentData.X + 28
            Y: =btnStudentData.Y + btnStudentData.Height - 36
      # ── Card 2 · Data Entry ────────────────────────────────────────────────
      - btnDataEntry:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(228, 234, 237, 1)
            BorderThickness: =1
            Color: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.Lato
            Height: =Max(230, (Parent.Height - 160) / 2)
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(244, 247, 249, 1)
            OnSelect: =Navigate(scrWindowSelect, ScreenTransition.Fade)
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(230, 244, 250, 1)
            Size: =1
            Text: =""
            Visible: =gblLandingLoaded
            Width: =(Parent.Width - 92) / 3
            X: =btnStudentData.X + btnStudentData.Width + 22
            Y: =136
      - recEdgeDataEntry:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 146, 201, 1)
            Height: =btnDataEntry.Height
            OnSelect: =Select(btnDataEntry)
            Visible: =gblLandingLoaded
            Width: =4
            X: =btnDataEntry.X
            Y: =btnDataEntry.Y
      - icoDataEntry:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(3, 108, 146, 1)
            Height: =40
            Icon: =Icon.Edit
            OnSelect: =Select(btnDataEntry)
            Visible: =gblLandingLoaded
            Width: =40
            X: =btnDataEntry.X + 28
            Y: =btnDataEntry.Y + 28
      - lblDataEntryTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(24, 43, 52, 1)
            Font: =Font.'Lato Black'
            Height: =30
            OnSelect: =Select(btnDataEntry)
            Size: =19
            Text: ="Data Entry"
            Visible: =gblLandingLoaded
            Width: =btnDataEntry.Width - 56
            X: =btnDataEntry.X + 28
            Y: =btnDataEntry.Y + 80
      - lblDataEntryDesc:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            Height: =btnDataEntry.Height - 160
            OnSelect: =Select(btnDataEntry)
            Size: =12
            Text: ="Record reading levels for a class during an open assessment window. The roster grid lets you enter a whole class at once."
            Visible: =gblLandingLoaded
            Width: =btnDataEntry.Width - 56
            X: =btnDataEntry.X + 28
            Y: =btnDataEntry.Y + 116
      - lblDataEntryGo:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(3, 108, 146, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Bold
            Height: =24
            OnSelect: =Select(btnDataEntry)
            Size: =12
            Text: ="Enter assessments  ›"
            Visible: =gblLandingLoaded
            Width: =btnDataEntry.Width - 56
            X: =btnDataEntry.X + 28
            Y: =btnDataEntry.Y + btnDataEntry.Height - 36
      # ── Card 3 · Student IPPs ──────────────────────────────────────────────
      - btnStudentIPPs:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(228, 234, 237, 1)
            BorderThickness: =1
            Color: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.Lato
            Height: =Max(230, (Parent.Height - 160) / 2)
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(244, 247, 249, 1)
            OnSelect: =Navigate(scrIPP, ScreenTransition.Fade)
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(230, 244, 250, 1)
            Size: =1
            Text: =""
            Visible: =gblLandingLoaded
            Width: =(Parent.Width - 92) / 3
            X: =btnDataEntry.X + btnDataEntry.Width + 22
            Y: =136
      - recEdgeStudentIPPs:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 146, 201, 1)
            Height: =btnStudentIPPs.Height
            OnSelect: =Select(btnStudentIPPs)
            Visible: =gblLandingLoaded
            Width: =4
            X: =btnStudentIPPs.X
            Y: =btnStudentIPPs.Y
      - icoStudentIPPs:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(3, 108, 146, 1)
            Height: =40
            Icon: =Icon.DocumentWithContent
            OnSelect: =Select(btnStudentIPPs)
            Visible: =gblLandingLoaded
            Width: =40
            X: =btnStudentIPPs.X + 28
            Y: =btnStudentIPPs.Y + 28
      - lblStudentIPPsTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(24, 43, 52, 1)
            Font: =Font.'Lato Black'
            Height: =30
            OnSelect: =Select(btnStudentIPPs)
            Size: =19
            Text: ="Student IPPs"
            Visible: =gblLandingLoaded
            Width: =btnStudentIPPs.Width - 56
            X: =btnStudentIPPs.X + 28
            Y: =btnStudentIPPs.Y + 80
      - lblStudentIPPsDesc:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            Height: =btnStudentIPPs.Height - 160
            OnSelect: =Select(btnStudentIPPs)
            Size: =12
            Text: ="Confirm which students have an Individual Program Plan by subject, so assessment data is interpreted correctly."
            Visible: =gblLandingLoaded
            Width: =btnStudentIPPs.Width - 56
            X: =btnStudentIPPs.X + 28
            Y: =btnStudentIPPs.Y + 116
      - lblStudentIPPsGo:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(3, 108, 146, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Bold
            Height: =24
            OnSelect: =Select(btnStudentIPPs)
            Size: =12
            Text: ="Confirm plans  ›"
            Visible: =gblLandingLoaded
            Width: =btnStudentIPPs.Width - 56
            X: =btnStudentIPPs.X + 28
            Y: =btnStudentIPPs.Y + btnStudentIPPs.Height - 36
      # ── Pointer-cursor overlays (§3g) ──────────────────────────────────────
      # One fully-transparent button per card, layered ON TOP of that card's
      # labels so the whole card shows the hand cursor (labels force the I-beam).
      # OnSelect = Select(<card>) so the Navigate target stays defined once, on
      # the card button. Faint cyan Hover/Pressed wash keeps hover feedback,
      # since the card button's own HoverFill no longer fires under the overlay.
      - btnCardLinkStudentData:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(0, 0, 0, 0)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledFill: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            Height: =btnStudentData.Height
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(0, 146, 201, 0.06)
            OnSelect: =Select(btnStudentData)
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(0, 146, 201, 0.1)
            Text: =""
            Visible: =gblLandingLoaded
            Width: =btnStudentData.Width
            X: =btnStudentData.X
            Y: =btnStudentData.Y
      - btnCardLinkDataEntry:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(0, 0, 0, 0)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledFill: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            Height: =btnDataEntry.Height
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(0, 146, 201, 0.06)
            OnSelect: =Select(btnDataEntry)
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(0, 146, 201, 0.1)
            Text: =""
            Visible: =gblLandingLoaded
            Width: =btnDataEntry.Width
            X: =btnDataEntry.X
            Y: =btnDataEntry.Y
      - btnCardLinkStudentIPPs:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(0, 0, 0, 0)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledFill: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            Height: =btnStudentIPPs.Height
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(0, 146, 201, 0.06)
            OnSelect: =Select(btnStudentIPPs)
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(0, 146, 201, 0.1)
            Text: =""
            Visible: =gblLandingLoaded
            Width: =btnStudentIPPs.Width
            X: =btnStudentIPPs.X
            Y: =btnStudentIPPs.Y
      - lblLoadingLanding:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            Height: =80
            Size: =14
            Text: ="Loading…"
            Visible: =Not(gblLandingLoaded)
            Width: =Parent.Width - 80
            X: =40
            Y: =(Parent.Height - Self.Height) / 2
