Screens:
  scrGroupSelect:
    Properties:
      Fill: =RGBA(0, 146, 201, 1)
      LoadingSpinnerColor: =RGBA(255, 255, 255, 1)
      OnVisible: =Set(gblGroupsLoaded, false); ClearCollect(colGroups, SortByColumns(Filter(vw_TeacherGroups, AssessmentWindowID = gblSelectedWindow.AssessmentWindowID), "Grade", SortOrder.Ascending, "GroupLabel", SortOrder.Ascending)); Set(gblGroupsLoaded, true)
    Children:
      - recContentPanelGroups:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height - 110
            Width: =Parent.Width - 40
            X: =20
            Y: =90
      - icoBackToWindows:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =40
            Icon: =Icon.ChevronLeft
            OnSelect: =Navigate(scrWindowSelect, ScreenTransition.Fade)
            Width: =40
            X: =20
            Y: =20
      - lblGroupTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Lato Black'
            Height: =32
            Size: =18
            Text: =gblSelectedWindow.WindowName
            Width: =900
            X: =80
            Y: =24
      - lblSubtitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 0.85)
            Font: =Font.Lato
            Height: =22
            Text: ="Choose a class"
            Width: =900
            X: =80
            Y: =58
      - galGroups:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height - Self.Y - 40
            Items: =colGroups
            OnSelect: =Set(gblSelectedGroup, ThisItem); Navigate(scrRosterGrid, ScreenTransition.None)
            TemplateSize: =76
            Width: =Parent.Width - 80
            X: =40
            Y: =100
          Children:
            - lblGroupLabel:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(50, 49, 48, 1)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  Font: =Font.Lato
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =12
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: =ThisItem.GroupLabel
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.TemplateWidth - 90
                  X: =20
                  Y: =(Parent.TemplateHeight - (Self.Height + lblGroupMeta.Height + lblProgress.Height)) / 2
            - lblGroupMeta:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(96, 94, 92, 1)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  Font: =Font.Lato
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =12
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =Switch(ThisItem.Grade, "P", "Primary", "PP", "Pre-Primary", "RG", "Returning Graduate", "Grade " & ThisItem.Grade) & " · " & ThisItem.ApplicableStudentCount & " applicable student" & If(ThisItem.ApplicableStudentCount = 1, "", "s")
                  VerticalAlign: =VerticalAlign.Top
                  Width: =lblGroupLabel.Width
                  X: =lblGroupLabel.X
                  Y: =lblGroupLabel.Y + lblGroupLabel.Height
            - lblProgress:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(96, 94, 92, 1)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  Font: =Font.Lato
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =12
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =If(ThisItem.EnteredStudentCount = ThisItem.ApplicableStudentCount, "✓ ", If(ThisItem.EnteredStudentCount = 0, "○ ", "◐ ")) & ThisItem.EnteredStudentCount & " of " & ThisItem.ApplicableStudentCount & " entered"
                  VerticalAlign: =VerticalAlign.Top
                  Width: =lblGroupLabel.Width
                  X: =lblGroupLabel.X
                  Y: =lblGroupMeta.Y + lblGroupMeta.Height
            - NextArrowGroup:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: =Self.Tooltip
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(166, 166, 166, 1)
                  DisabledBorderColor: =RGBA(56, 56, 56, 1)
                  DisabledColor: =RGBA(119, 119, 119, 1)
                  Height: =50
                  Icon: =Icon.ChevronRight
                  OnSelect: =Select(Parent)
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  Tooltip: ="Open this group"
                  Width: =50
                  X: =Parent.TemplateWidth - Self.Width - 12
                  Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
            - SeparatorGroup:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(245, 245, 245, 1)
                  Height: =1
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - Self.Height
            - SelectionBarGroup:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 120, 212, 1)
                  Height: =Parent.TemplateHeight - SeparatorGroup.Height
                  OnSelect: =Select(Parent)
                  Visible: =ThisItem.IsSelected
                  Width: =4
      - lblLoading:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(96, 94, 92, 1)
            Font: =Font.Lato
            Size: =14
            Text: ="Loading classes…"
            Visible: =Not(gblGroupsLoaded)
            Width: =640
            X: =40
            Y: =340
      - lblEmptyState:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(96, 94, 92, 1)
            Font: =Font.Lato
            Height: =80
            Size: =14
            Text: ="No applicable groups for " & gblSelectedWindow.WindowName & ". This can happen if your applicable students don't fall under any group (homeroom for PP-9, section for 10-12)."
            Visible: =gblGroupsLoaded And CountRows(colGroups) = 0
            Width: =640
            X: =40
            Y: =340
