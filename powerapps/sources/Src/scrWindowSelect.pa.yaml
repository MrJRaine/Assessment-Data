Screens:
  scrWindowSelect:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: =Set(gblWindowsLoaded, false); ClearCollect(colWindows, vw_UserAssessmentWindows); Set(gblWindowsLoaded, true)
    Children:
      - icoBack:
          Control: ModernIcon@1.1.0
          Properties:
            Icon: ="ArrowLeft"
            Height: =40
            Width: =40
            X: =20
            Y: =20
            OnSelect: =Navigate(scrLanding, ScreenTransition.Fade)
      - lblTitle:
          Control: Label@2.5.1
          Properties:
            Text: ="Choose an assessment window"
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Size: =18
            Color: =RGBA(50, 49, 48, 1)
            X: =80
            Y: =24
            Width: =500
            Height: =40
      - galWindows:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Items: =colWindows
            BorderColor: =RGBA(245, 245, 245, 1)
            X: =40
            Y: =80
            Width: =640
            Height: =560
            OnSelect: =Set(gblSelectedWindow, ThisItem); Navigate(scrGroupSelect, ScreenTransition.Fade)
          Children:
            - Title1:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(50, 49, 48, 1)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =12
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: =ThisItem.WindowName
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.TemplateWidth - 90
                  X: =20
                  Y: =(Parent.TemplateHeight - (Self.Size * 1.8 + Subtitle1.Size * 1.8)) / 2
            - Subtitle1:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(96, 94, 92, 1)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =12
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =ThisItem.AssessmentType & " · Grades " & ThisItem.MinGrade & "-" & ThisItem.MaxGrade & " · " & ThisItem.WindowStatus
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Title1.Width
                  X: =Title1.X
                  Y: =Title1.Y + Title1.Height
            - NextArrow1:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: =Self.Tooltip
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(166, 166, 166, 1)
                  DisabledBorderColor: =RGBA(56, 56, 56, 1)
                  DisabledColor: =RGBA(119, 119, 119, 1)
                  Height: =50
                  Icon: =Icon.ChevronRight
                  OnSelect: =Select(Parent)
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  Tooltip: ="Open this window"
                  Width: =50
                  X: =Parent.TemplateWidth - Self.Width - 12
                  Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
            - Separator1:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(245, 245, 245, 1)
                  Height: =1
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - Self.Height
            - Rectangle1:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 120, 212, 1)
                  Height: =Parent.TemplateHeight - Separator1.Height
                  OnSelect: =Select(Parent)
                  Visible: =ThisItem.IsSelected
                  Width: =4
      - lblLoadingWindows:
          Control: Label@2.5.1
          Properties:
            Text: ="Loading assessment windows…"
            Font: =Font.'Segoe UI'
            Color: =RGBA(96, 94, 92, 1)
            Size: =14
            Align: =Align.Center
            X: =40
            Y: =340
            Width: =640
            Height: =40
            Visible: =Not(gblWindowsLoaded)
      - lblEmpty:
          Control: Label@2.5.1
          Properties:
            Text: ="No assessment windows currently apply to your students. New windows appear here when admins open them."
            Font: =Font.'Segoe UI'
            Color: =RGBA(96, 94, 92, 1)
            Size: =14
            Align: =Align.Center
            X: =40
            Y: =340
            Width: =640
            Height: =80
            Visible: =gblWindowsLoaded And CountRows(colWindows) = 0
