# ── Direction B restyle (Edge-to-Edge) ──────────────────────────────────────
# Visual-only restyle, ported from handoff/powerapps_yaml/scrWindowSelect.pa.yaml.
# UNTOUCHED: OnVisible, galWindows Items/OnSelect/Visible, Title1/Subtitle1 Text,
# navigation — all verified identical to the prior live screen.
#
# Bug pre-audit (§3i) — this screen is clean on all three signatures:
#   A (text clip): only single-line labels (Title/Subtitle = Self.Size*1.8);
#       lblEmpty carries an explicit Height. No multi-line clip risk.
#   B (load ghosting): the only content control is galWindows, already gated
#       Visible: =gblWindowsLoaded; loading/empty labels gate inversely; the
#       header (back + title) + white panel are intentionally always-on.
#   C (Fill on ModernButton): no buttons on this screen — N/A.
#
# Local polish vs handoff:
#   - lblLoadingWindows given an explicit Height(40) and true vertical centering
#     to match lblEmpty (handoff left it height-less).
#   - btnWindowRowLink: transparent topmost overlay per row (§3g) so the whole
#     row shows the hand/pointer cursor (labels force the I-beam). OnSelect =
#     Select(Parent) bubbles to the row's Set+Navigate. Faint cyan hover wash.
#
# Token map: brand RGBA(0,146,201) · brand-ink RGBA(3,108,146) · ink RGBA(24,43,52)
#   · ink-3 RGBA(110,126,134) · line RGBA(228,234,237) · row-line RGBA(212,221,226)
# ─────────────────────────────────────────────────────────────────────────────
Screens:
  scrWindowSelect:
    Properties:
      Fill: =RGBA(0, 146, 201, 1)
      LoadingSpinnerColor: =RGBA(255, 255, 255, 1)
      OnVisible: =Set(gblWindowsLoaded, false); Clear(colWindows); Refresh(vw_UserAssessmentWindows); ClearCollect(colWindows, vw_UserAssessmentWindows); Set(gblWindowsLoaded, true)
    Children:
      # Edge-to-Edge: white workspace fills below a slim 52px cyan header band.
      - recContentPanelWindows:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height - 52
            Width: =Parent.Width
            X: =0
            Y: =52
      - icoBack:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =32
            Icon: =Icon.ChevronLeft
            OnSelect: =Navigate(scrLanding, ScreenTransition.Fade)
            Width: =32
            X: =16
            Y: =10
      - lblTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Lato Black'
            Size: =17
            Text: ="Choose an assessment window"
            Width: =600
            X: =56
            Y: =14
      - galWindows:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(228, 234, 237, 1)
            Height: =Parent.Height - Self.Y - 24
            Items: =colWindows
            OnSelect: =Set(gblSelectedWindow, ThisItem); Navigate(scrGroupSelect, ScreenTransition.Fade)
            TemplateSize: =72
            Visible: =gblWindowsLoaded
            Width: =Parent.Width - 48
            X: =24
            Y: =72
          Children:
            - Title1:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(24, 43, 52, 1)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  Font: =Font.Lato
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Bold, FontWeight.Semibold)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =16
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: =ThisItem.WindowName
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.TemplateWidth - 90
                  X: =16
                  Y: =(Parent.TemplateHeight - (Self.Size * 1.8 + Subtitle1.Size * 1.8)) / 2
            - Subtitle1:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(110, 126, 134, 1)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  Font: =Font.Lato
                  FontWeight: =FontWeight.Normal
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =16
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =ThisItem.AssessmentType & " · Grades " & ThisItem.MinGrade & "-" & ThisItem.MaxGrade & " · " & ThisItem.WindowStatus
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Title1.Width
                  X: =Title1.X
                  Y: =Title1.Y + Title1.Height
            - NextArrow1:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: =Self.Tooltip
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(3, 108, 146, 1)
                  DisabledBorderColor: =RGBA(56, 56, 56, 1)
                  DisabledColor: =RGBA(119, 119, 119, 1)
                  Height: =44
                  Icon: =Icon.ChevronRight
                  OnSelect: =Select(Parent)
                  PaddingBottom: =14
                  PaddingLeft: =14
                  PaddingRight: =14
                  PaddingTop: =14
                  Tooltip: ="Open this window"
                  Width: =44
                  X: =Parent.TemplateWidth - Self.Width - 14
                  Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
            - Separator1:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(212, 221, 226, 1)
                  Height: =1
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - Self.Height
            - Rectangle1:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 146, 201, 1)
                  Height: =Parent.TemplateHeight - Separator1.Height
                  OnSelect: =Select(Parent)
                  Visible: =ThisItem.IsSelected
                  Width: =4
            # Pointer-cursor overlay (§3g) — topmost, transparent, full-row.
            - btnWindowRowLink:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  Color: =RGBA(0, 0, 0, 0)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =Parent.TemplateHeight - Separator1.Height
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(0, 0, 0, 0)
                  HoverFill: =RGBA(0, 146, 201, 0.06)
                  OnSelect: =Select(Parent)
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =RGBA(0, 0, 0, 0)
                  PressedFill: =RGBA(0, 146, 201, 0.1)
                  Text: =""
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
      - lblLoadingWindows:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            Height: =40
            Size: =14
            Text: ="Loading assessment windows…"
            Visible: =Not(gblWindowsLoaded)
            Width: =Parent.Width - 48
            X: =24
            Y: =(Parent.Height - Self.Height) / 2
      - lblEmpty:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            Height: =80
            Size: =14
            Text: ="No assessment windows currently apply to your students. New windows appear here when admins open them."
            Visible: =gblWindowsLoaded And CountRows(colWindows) = 0
            Width: =Parent.Width - 48
            X: =24
            Y: =(Parent.Height - Self.Height) / 2
