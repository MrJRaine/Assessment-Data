Screens:
  scrRosterGrid:
    Properties:
      Fill: =RGBA(0, 146, 201, 1)
      LoadingSpinnerColor: =RGBA(255, 255, 255, 1)
      OnVisible: |
        =Set(gblCanEdit, gblIsAdminOrAnalyst Or gblSelectedWindow.WindowStatus = "Open" Or gblSelectedWindow.WindowStatus = "ClosesToday");
        ClearCollect(colDirty, { StudentNumber: 0, ReadingScaleID: "", LevelCode: "" });
        Clear(colDirty);
        Set(gblRosterLoaded, false);
        Refresh(vw_TeacherRoster);
        ClearCollect(colRoster, SortByColumns(Filter(vw_TeacherRoster, AssessmentWindowID = gblSelectedWindow.AssessmentWindowID And GroupKey = gblSelectedGroup.GroupKey), "LastName", SortOrder.Ascending, "FirstName", SortOrder.Ascending));
        Set(gblRosterLoaded, true)
    Children:
      - recContentPanelRoster:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height - 100
            Width: =Parent.Width - 40
            X: =20
            Y: =80
      - icoBackToGroups:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =40
            Icon: =Icon.ChevronLeft
            OnSelect: |
              =If(CountRows(colDirty) > 0, UpdateContext({ ctxShowUnsavedConfirm: true }), Navigate(scrGroupSelect, ScreenTransition.Fade))
            Width: =40
            X: =20
            Y: =20
      - lblRosterTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Lato Black'
            Height: =36
            Size: =16
            Text: =gblSelectedGroup.GroupLabel & " — " & gblSelectedWindow.WindowName
            Width: =800
            X: =80
            Y: =20
      - lblReadOnlyBadge:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(180, 50, 50, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =24
            Text: |-
              ="🔒 Read-only"
            Visible: =!gblCanEdit
            Width: =200
            X: =80
            Y: =58
      - btnSaveTop:
          Control: ModernButton@1.0.0
          Properties:
            DisplayMode: =If(CountRows(colDirty) = 0, DisplayMode.Disabled, DisplayMode.Edit)
            Height: =40
            OnSelect: =Select(btnSaveBottom)
            Text: |-
              ="💾 Save " & CountRows(colDirty) & If(CountRows(colDirty) = 1, " change", " changes")
            Visible: =gblCanEdit
            Width: =220
            X: =900
            Y: =20
      - galRoster:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height - Self.Y - 80
            Items: =colRoster
            TemplateSize: =56
            Width: =Parent.Width - 80
            X: =40
            Y: =100
          Children:
            - Image1Roster:
                Control: Image@2.2.3
                Properties:
                  Height: =1
                  Visible: =false
                  Width: =1
            - lblStudentName:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(50, 49, 48, 1)
                  Font: =Font.Lato
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  PaddingLeft: =12
                  Size: =14
                  Text: =ThisItem.LastName & ", " & ThisItem.FirstName
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =380
                  X: =20
                  Y: =0
            - lblExistingLevel:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(96, 94, 92, 1)
                  Font: =Font.Lato
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  PaddingLeft: =12
                  Size: =12
                  Text: |
                    ="Existing: " & Coalesce(ThisItem.ExistingScaleValue, "—")
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =200
                  X: =420
                  Y: =0
            - cmbNewLevel:
                Control: ModernCombobox@1.1.0
                Properties:
                  DefaultSelectedItems: =Blank()
                  DisplayMode: =If(gblCanEdit, DisplayMode.Edit, DisplayMode.View)
                  Height: =40
                  InputTextPlaceholder: ="Select Reading Level"
                  ItemDisplayText: =ThisItem.LevelCode
                  Items: =SortByColumns(Filter(vw_DimReadingScale, ScaleSystem = gblSelectedWindow.ScaleSystem And ActiveFlag = true), "LevelOrder", SortOrder.Ascending)
                  OnChange: |
                    =If(
                        IsBlank(cmbNewLevel.Selected),
                        Remove(colDirty, LookUp(colDirty, StudentNumber = ThisItem.StudentNumber)),
                        cmbNewLevel.Selected.ReadingScaleID = ThisItem.ExistingReadingScaleID,
                        Remove(colDirty, LookUp(colDirty, StudentNumber = ThisItem.StudentNumber));
                        Reset(cmbNewLevel),
                        Remove(colDirty, LookUp(colDirty, StudentNumber = ThisItem.StudentNumber));
                        Collect(colDirty, {
                            StudentNumber:  ThisItem.StudentNumber,
                            ReadingScaleID: cmbNewLevel.Selected.ReadingScaleID,
                            LevelCode:      cmbNewLevel.Selected.LevelCode
                        })
                    )
                  SelectMultiple: =false
                  Width: =200
                  X: =640
                  Y: =(Parent.TemplateHeight - Self.Height) / 2
            - icoDirty:
                Control: Classic/Icon@2.5.0
                Properties:
                  Color: =RGBA(30, 130, 30, 1)
                  Height: =28
                  Icon: =Icon.Check
                  OnSelect: =Select(Parent)
                  Visible: =!IsBlank(LookUp(colDirty, StudentNumber = ThisItem.StudentNumber))
                  Width: =28
                  X: =860
                  Y: =(Parent.TemplateHeight - Self.Height) / 2
            - icoDelete:
                Control: Classic/Icon@2.5.0
                Properties:
                  Color: =RGBA(180, 50, 50, 1)
                  Height: =28
                  Icon: =Icon.Trash
                  OnSelect: |
                    =UpdateContext({
                        ctxShowDeleteConfirm:   true,
                        ctxDeleteStudentNumber: ThisItem.StudentNumber,
                        ctxDeleteStudentName:   ThisItem.FirstName & " " & ThisItem.LastName,
                        ctxDeleteLevelCode:     ThisItem.ExistingScaleValue
                    })
                  Visible: =Not(IsBlank(ThisItem.ExistingReadingScaleID)) And gblCanEdit
                  Width: =28
                  X: =920
                  Y: =(Parent.TemplateHeight - Self.Height) / 2
            - NextArrowRoster:
                Control: Classic/Icon@2.5.0
                Properties:
                  Height: =1
                  Icon: =Icon.ChevronRight
                  OnSelect: =Select(Parent)
                  Visible: =false
                  Width: =1
            - SeparatorRoster:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(245, 245, 245, 1)
                  Height: =1
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - Self.Height
            - SelectionBarRoster:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 120, 212, 1)
                  Height: =1
                  OnSelect: =Select(Parent)
                  Visible: =false
                  Width: =1
      - lblLoadingRoster:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(96, 94, 92, 1)
            Font: =Font.Lato
            Height: =40
            Size: =14
            Text: ="Loading roster…"
            Visible: =Not(gblRosterLoaded)
            Width: =1120
            X: =40
            Y: =(Parent.Height - Self.Height) / 2
      - lblEmptyRoster:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(96, 94, 92, 1)
            Font: =Font.Lato
            Height: =40
            Size: =14
            Text: ="No applicable students in this group for this window."
            Visible: =gblRosterLoaded And CountRows(colRoster) = 0
            Width: =1120
            X: =40
            Y: =(Parent.Height - Self.Height) / 2
      - btnSaveBottom:
          Control: ModernButton@1.0.0
          Properties:
            DisplayMode: =If(CountRows(colDirty) = 0, DisplayMode.Disabled, DisplayMode.Edit)
            Height: =44
            OnSelect: |
              =ForAll(colDirty,
                  Assessment_Warehouse.dbouspUpsertReadingAssessment({
                      StudentNumber:      ThisRecord.StudentNumber,
                      AssessmentWindowID: Text(gblSelectedWindow.AssessmentWindowID),
                      ReadingScaleID:     Text(ThisRecord.ReadingScaleID),
                      AssessmentDate:     Today()
                  })
              );
              Notify("Saved " & CountRows(colDirty) & " assessment" & If(CountRows(colDirty) = 1, "", "s"), NotificationType.Success);
              Clear(colDirty);
              Set(gblRosterLoaded, false);
              Refresh(vw_TeacherRoster);
              ClearCollect(colRoster, SortByColumns(Filter(vw_TeacherRoster, AssessmentWindowID = gblSelectedWindow.AssessmentWindowID And GroupKey = gblSelectedGroup.GroupKey), "LastName", SortOrder.Ascending, "FirstName", SortOrder.Ascending));
              Set(gblRosterLoaded, true);
              Reset(galRoster)
            Text: |-
              ="💾 Save " & CountRows(colDirty) & If(CountRows(colDirty) = 1, " change", " changes")
            Visible: =gblCanEdit
            Width: =220
            X: =500
            Y: =Parent.Height - 60
      - lblReadOnlyExplain:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(120, 120, 120, 1)
            Font: =Font.Lato
            Height: =44
            Text: ="This window closed on " & Text(gblSelectedWindow.EndDate, "mmm d yyyy") & ". Contact a school admin if changes are needed."
            Visible: =!gblCanEdit
            Width: =1120
            X: =40
            Y: =Parent.Height - 60
      - recUnsavedOverlay:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0.4)
            Height: =Parent.Height
            Visible: =ctxShowUnsavedConfirm
            Width: =Parent.Width
      - recUnsavedModal:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(200, 200, 200, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =200
            Visible: =ctxShowUnsavedConfirm
            Width: =460
            X: =(Parent.Width - 460) / 2
            Y: =(Parent.Height - 200) / 2
      - lblUnsavedConfirmText:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(50, 49, 48, 1)
            Font: =Font.Lato
            Height: =60
            Size: =14
            Text: ="You have " & CountRows(colDirty) & " unsaved change" & If(CountRows(colDirty) = 1, "", "s") & ". Leave anyway?"
            Visible: =ctxShowUnsavedConfirm
            Width: =440
            X: =(Parent.Width - 440) / 2
            Y: =(Parent.Height - 200) / 2 + 30
      - btnConfirmDiscard:
          Control: ModernButton@1.0.0
          Properties:
            Height: =44
            OnSelect: |
              =Clear(colDirty); UpdateContext({ ctxShowUnsavedConfirm: false }); Navigate(scrGroupSelect, ScreenTransition.Fade)
            Text: ="Discard changes"
            Visible: =ctxShowUnsavedConfirm
            Width: =180
            X: =(Parent.Width - 460) / 2 + 30
            Y: =(Parent.Height - 200) / 2 + 120
      - btnConfirmCancel:
          Control: ModernButton@1.0.0
          Properties:
            Height: =44
            OnSelect: |
              =UpdateContext({ ctxShowUnsavedConfirm: false })
            Text: ="Keep editing"
            Visible: =ctxShowUnsavedConfirm
            Width: =180
            X: =(Parent.Width - 460) / 2 + 250
            Y: =(Parent.Height - 200) / 2 + 120
      - recDeleteBackdrop:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(0, 0, 0, 0.4)
            Height: =Parent.Height
            Visible: =ctxShowDeleteConfirm
            Width: =Parent.Width
      - recDeleteModal:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(200, 200, 200, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =220
            Visible: =ctxShowDeleteConfirm
            Width: =500
            X: =(Parent.Width - 500) / 2
            Y: =(Parent.Height - 220) / 2
      - lblDeleteConfirmText:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(50, 49, 48, 1)
            Font: =Font.Lato
            Height: =80
            Size: =14
            Text: |
              ="Remove " & ctxDeleteStudentName & "'s reading assessment (currently " & Coalesce(ctxDeleteLevelCode, "—") & ")? This cannot be undone."
            Visible: =ctxShowDeleteConfirm
            Width: =480
            X: =(Parent.Width - 480) / 2
            Y: =(Parent.Height - 220) / 2 + 30
      - btnConfirmDelete:
          Control: ModernButton@1.0.0
          Properties:
            Height: =44
            OnSelect: |
              =Assessment_Warehouse.dbouspDeleteReadingAssessment({
                  StudentNumber:      ctxDeleteStudentNumber,
                  AssessmentWindowID: Text(gblSelectedWindow.AssessmentWindowID)
              });
              Notify("Removed assessment for " & ctxDeleteStudentName, NotificationType.Success);
              UpdateContext({ ctxShowDeleteConfirm: false });
              Set(gblRosterLoaded, false);
              Refresh(vw_TeacherRoster);
              ClearCollect(colRoster, SortByColumns(Filter(vw_TeacherRoster, AssessmentWindowID = gblSelectedWindow.AssessmentWindowID And GroupKey = gblSelectedGroup.GroupKey), "LastName", SortOrder.Ascending, "FirstName", SortOrder.Ascending));
              Set(gblRosterLoaded, true);
              Reset(galRoster)
            Text: ="Remove assessment"
            Visible: =ctxShowDeleteConfirm
            Width: =200
            X: =(Parent.Width - 500) / 2 + 30
            Y: =(Parent.Height - 220) / 2 + 140
      - btnConfirmDeleteCancel:
          Control: ModernButton@1.0.0
          Properties:
            Height: =44
            OnSelect: |
              =UpdateContext({ ctxShowDeleteConfirm: false })
            Text: ="Cancel"
            Visible: =ctxShowDeleteConfirm
            Width: =180
            X: =(Parent.Width - 500) / 2 + 290
            Y: =(Parent.Height - 220) / 2 + 140
