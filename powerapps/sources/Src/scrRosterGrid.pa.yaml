Screens:
  scrRosterGrid:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |
        =Set(gblCanEdit, gblIsAdminOrAnalyst Or gblSelectedWindow.WindowStatus = "Open" Or gblSelectedWindow.WindowStatus = "ClosesToday");
        ClearCollect(colDirty, { StudentNumber: 0, ReadingScaleID: "", LevelCode: "" });
        Clear(colDirty);
        Set(gblRosterLoaded, false);
        ClearCollect(colRoster, SortByColumns(Filter(vw_TeacherRoster, AssessmentWindowID = gblSelectedWindow.AssessmentWindowID And GroupKey = gblSelectedGroup.GroupKey), "LastName", SortOrder.Ascending, "FirstName", SortOrder.Ascending));
        Set(gblRosterLoaded, true)
    Children:
      - icoBackToGroups:
          Control: ModernIcon@1.1.0
          Properties:
            Icon: ="ArrowLeft"
            Height: =40
            Width: =40
            X: =20
            Y: =20
            OnSelect: |
              =If(CountRows(colDirty) > 0, UpdateContext({ ctxShowUnsavedConfirm: true }), Navigate(scrGroupSelect, ScreenTransition.Fade))
      - lblRosterTitle:
          Control: Label@2.5.1
          Properties:
            Text: =gblSelectedGroup.GroupLabel & " — " & gblSelectedWindow.WindowName
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Size: =16
            Color: =RGBA(50, 49, 48, 1)
            X: =80
            Y: =20
            Width: =800
            Height: =36
      - lblReadOnlyBadge:
          Control: Label@2.5.1
          Properties:
            Text: ="🔒 Read-only"
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Size: =13
            Color: =RGBA(180, 50, 50, 1)
            X: =80
            Y: =58
            Width: =200
            Height: =24
            Visible: =!gblCanEdit
      - btnSaveTop:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="💾 Save " & CountRows(colDirty) & If(CountRows(colDirty) = 1, " change", " changes")
            X: =900
            Y: =20
            Width: =220
            Height: =40
            Visible: =gblCanEdit
            DisplayMode: =If(CountRows(colDirty) = 0, DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: =Select(btnSaveBottom)
      - galRoster:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Items: =colRoster
            BorderColor: =RGBA(245, 245, 245, 1)
            TemplateSize: =72
            X: =40
            Y: =100
            Width: =1120
            Height: =460
          Children:
            - Image1Roster:
                Control: Image@2.2.3
                Properties:
                  Visible: =false
                  Height: =1
                  Width: =1
                  X: =0
                  Y: =0
            - lblStudentName:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.LastName & ", " & ThisItem.FirstName
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Size: =14
                  Color: =RGBA(50, 49, 48, 1)
                  VerticalAlign: =VerticalAlign.Middle
                  PaddingLeft: =12
                  Width: =380
                  Height: =40
                  X: =20
                  Y: =16
                  OnSelect: =Select(Parent)
            - lblExistingLevel:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    ="Existing: " & Coalesce(ThisItem.ExistingScaleValue, "—")
                  Font: =Font.'Segoe UI'
                  Size: =12
                  Color: =RGBA(96, 94, 92, 1)
                  VerticalAlign: =VerticalAlign.Middle
                  PaddingLeft: =12
                  Width: =200
                  Height: =40
                  X: =420
                  Y: =16
                  OnSelect: =Select(Parent)
            - cmbNewLevel:
                Control: ModernCombobox@1.1.0
                Properties:
                  Items: =SortByColumns(Filter(vw_DimReadingScale, ScaleSystem = gblSelectedWindow.ScaleSystem And ActiveFlag = true), "LevelOrder", SortOrder.Ascending)
                  ItemDisplayText: =ThisItem.LevelCode
                  SelectMultiple: =false
                  DisplayMode: =If(gblCanEdit, DisplayMode.Edit, DisplayMode.View)
                  DefaultSelectedItems: =If(IsBlank(ThisItem.ExistingReadingScaleID), Blank(), Filter(vw_DimReadingScale, ReadingScaleID = ThisItem.ExistingReadingScaleID))
                  Width: =200
                  Height: =44
                  X: =640
                  Y: =14
                  OnChange: |
                    =If(
                        IsBlank(cmbNewLevel.Selected) Or cmbNewLevel.Selected.ReadingScaleID = ThisItem.ExistingReadingScaleID,
                        Remove(colDirty, LookUp(colDirty, StudentNumber = ThisItem.StudentNumber)),
                        Remove(colDirty, LookUp(colDirty, StudentNumber = ThisItem.StudentNumber));
                        Collect(colDirty, {
                            StudentNumber:  ThisItem.StudentNumber,
                            ReadingScaleID: cmbNewLevel.Selected.ReadingScaleID,
                            LevelCode:      cmbNewLevel.Selected.LevelCode
                        })
                    )
            - icoDirty:
                Control: Classic/Icon@2.5.0
                Properties:
                  Icon: =Icon.Check
                  Color: =RGBA(30, 130, 30, 1)
                  Width: =28
                  Height: =28
                  X: =860
                  Y: =22
                  Visible: =!IsBlank(LookUp(colDirty, StudentNumber = ThisItem.StudentNumber))
                  OnSelect: =Select(Parent)
            - NextArrowRoster:
                Control: Classic/Icon@2.5.0
                Properties:
                  Visible: =false
                  Icon: =Icon.ChevronRight
                  Height: =1
                  Width: =1
                  X: =0
                  Y: =0
                  OnSelect: =Select(Parent)
            - SeparatorRoster:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(245, 245, 245, 1)
                  Height: =1
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - Self.Height
                  OnSelect: =Select(Parent)
            - SelectionBarRoster:
                Control: Rectangle@2.3.0
                Properties:
                  Visible: =false
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 120, 212, 1)
                  Height: =1
                  Width: =1
                  X: =0
                  Y: =0
                  OnSelect: =Select(Parent)
      - lblLoadingRoster:
          Control: Label@2.5.1
          Properties:
            Text: ="Loading roster…"
            Font: =Font.'Segoe UI'
            Color: =RGBA(96, 94, 92, 1)
            Size: =14
            Align: =Align.Center
            X: =40
            Y: =300
            Width: =1120
            Height: =40
            Visible: =Not(gblRosterLoaded)
      - lblEmptyRoster:
          Control: Label@2.5.1
          Properties:
            Text: ="No applicable students in this group for this window."
            Font: =Font.'Segoe UI'
            Color: =RGBA(96, 94, 92, 1)
            Size: =14
            Align: =Align.Center
            X: =40
            Y: =300
            Width: =1120
            Height: =40
            Visible: =gblRosterLoaded And CountRows(colRoster) = 0
      - btnSaveBottom:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="💾 Save " & CountRows(colDirty) & If(CountRows(colDirty) = 1, " change", " changes")
            X: =500
            Y: =585
            Width: =220
            Height: =44
            Visible: =gblCanEdit
            DisplayMode: =If(CountRows(colDirty) = 0, DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |
              =ForAll(colDirty,
                  Assessment_Warehouse.dbouspUpsertReadingAssessment({
                      StudentNumber:      ThisRecord.StudentNumber,
                      AssessmentWindowID: Text(gblSelectedWindow.AssessmentWindowID),
                      ReadingScaleID:     Text(ThisRecord.ReadingScaleID),
                      AssessmentDate:     Today()
                  })
              );
              Notify("Saved " & CountRows(colDirty) & " assessment" & If(CountRows(colDirty) = 1, "", "s"), NotificationType.Success);
              Clear(colDirty);
              Set(gblRosterLoaded, false);
              ClearCollect(colRoster, SortByColumns(Filter(vw_TeacherRoster, AssessmentWindowID = gblSelectedWindow.AssessmentWindowID And GroupKey = gblSelectedGroup.GroupKey), "LastName", SortOrder.Ascending, "FirstName", SortOrder.Ascending));
              Set(gblRosterLoaded, true)
      - lblReadOnlyExplain:
          Control: Label@2.5.1
          Properties:
            Text: ="This window closed on " & Text(gblSelectedWindow.EndDate, "mmm d yyyy") & ". Contact a school admin if changes are needed."
            Font: =Font.'Segoe UI'
            Color: =RGBA(120, 120, 120, 1)
            Size: =13
            Align: =Align.Center
            X: =40
            Y: =585
            Width: =1120
            Height: =44
            Visible: =!gblCanEdit
      - recUnsavedOverlay:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(0, 0, 0, 0.4)
            BorderColor: =RGBA(0, 0, 0, 0)
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Visible: =ctxShowUnsavedConfirm
      - recUnsavedModal:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(200, 200, 200, 1)
            BorderThickness: =1
            X: =(Parent.Width - 460) / 2
            Y: =(Parent.Height - 200) / 2
            Width: =460
            Height: =200
            Visible: =ctxShowUnsavedConfirm
      - lblUnsavedConfirmText:
          Control: Label@2.5.1
          Properties:
            Text: ="You have " & CountRows(colDirty) & " unsaved change" & If(CountRows(colDirty) = 1, "", "s") & ". Leave anyway?"
            Font: =Font.'Segoe UI'
            Size: =14
            Color: =RGBA(50, 49, 48, 1)
            Align: =Align.Center
            X: =(Parent.Width - 440) / 2
            Y: =(Parent.Height - 200) / 2 + 30
            Width: =440
            Height: =60
            Visible: =ctxShowUnsavedConfirm
      - btnConfirmDiscard:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Discard changes"
            X: =(Parent.Width - 460) / 2 + 30
            Y: =(Parent.Height - 200) / 2 + 120
            Width: =180
            Height: =44
            Visible: =ctxShowUnsavedConfirm
            OnSelect: |
              =Clear(colDirty); UpdateContext({ ctxShowUnsavedConfirm: false }); Navigate(scrGroupSelect, ScreenTransition.Fade)
      - btnConfirmCancel:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Keep editing"
            X: =(Parent.Width - 460) / 2 + 250
            Y: =(Parent.Height - 200) / 2 + 120
            Width: =180
            Height: =44
            Visible: =ctxShowUnsavedConfirm
            OnSelect: |
              =UpdateContext({ ctxShowUnsavedConfirm: false })
