# ── Direction B restyle (ported from handoff 2026-06-11) ────────────────────
# Visual only, EXCEPT the one approved data-tint swap: recRowBackgroundRoster.Fill
# ends in `ColorValue(LookUp(...).HexColorTint)` instead of
# `ColorFade(ColorValue(LookUp(...).HexColor), 0.4)`. Delta-band LookUp otherwise
# identical. ADDED (handoff concept extras): lblRosterStatus pill + lblRosterMeta
# count (existing data only).
# DELIBERATE DEVIATIONS from the handoff (§3i pre-scrub):
#   - All 8 ModernButtons → Classic/Button@2.2.0 (handoff sets Fill/BorderColor on
#     ModernButton → PA2108). Radius* dropped (classic = square). Hover/Pressed
#     palette copied from scrIPP: secondary white (btnSaveTop, btnInlineIPPNo,
#     btnConfirmCancel, btnConfirmDeleteCancel), primary cyan (btnInlineIPPYes,
#     btnSaveBottom, btnConfirmDiscard), danger red (btnConfirmDelete).
#   - Load-ghosting gating: status pill, read-only badge, meta count, 6 column
#     headers, save buttons, read-only explainer all gated on gblRosterLoaded.
# Untouched: OnVisible, all OnSelect (Upsert/Delete stored procs), OnChange, Items,
# the With/LookUp delta math, gblCanEdit gating, modal flow.
# ─────────────────────────────────────────────────────────────────────────────
Screens:
  scrRosterGrid:
    Properties:
      Fill: =RGBA(0, 146, 201, 1)
      LoadingSpinnerColor: =RGBA(255, 255, 255, 1)
      OnVisible: |
        =Set(gblCanEdit, gblIsAdminOrAnalyst Or gblSelectedWindow.WindowStatus = "Open" Or gblSelectedWindow.WindowStatus = "ClosesToday");
        ClearCollect(colDirty, { StudentNumber: 0, ReadingScaleID: "", LevelCode: "" });
        Clear(colDirty);
        ClearCollect(colAchievementLevels, DimAchievementLevel);
        Set(gblRosterLoaded, false);
        Clear(colRoster);
        Refresh(vw_TeacherRoster);
        ClearCollect(colRoster, SortByColumns(Filter(vw_TeacherRoster, AssessmentWindowID = gblSelectedWindow.AssessmentWindowID And GroupKey = gblSelectedGroup.GroupKey), "LastName", SortOrder.Ascending, "FirstName", SortOrder.Ascending));
        Set(gblRosterLoaded, true)
    Children:
      - recContentPanelRoster:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height - 52
            Width: =Parent.Width
            X: =0
            Y: =52
      - icoBackToGroups:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =32
            Icon: =Icon.ChevronLeft
            OnSelect: |
              =If(CountRows(colDirty) > 0, UpdateContext({ ctxShowUnsavedConfirm: true }), Navigate(scrGroupSelect, ScreenTransition.Fade))
            Width: =32
            X: =16
            Y: =10
      - lblRosterTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Lato Black'
            Height: =32
            Size: =17
            Text: =gblSelectedGroup.GroupLabel & " — " & gblSelectedWindow.WindowName
            Width: =Parent.Width - 320
            X: =56
            Y: =14
      - btnSaveTop:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(228, 234, 237, 1)
            BorderThickness: =1
            Color: =RGBA(3, 108, 146, 1)
            DisplayMode: =If(CountRows(colDirty) = 0, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.Lato
            Height: =32
            HoverColor: =RGBA(3, 108, 146, 1)
            HoverFill: =RGBA(244, 247, 249, 1)
            OnSelect: =Select(btnSaveBottom)
            PressedColor: =RGBA(3, 108, 146, 1)
            PressedFill: =RGBA(230, 244, 250, 1)
            Size: =13
            Text: |-
              ="Save " & CountRows(colDirty) & If(CountRows(colDirty) = 1, " change", " changes")
            Visible: =gblCanEdit And gblRosterLoaded
            Width: =200
            X: =Parent.Width - 216
            Y: =10
      - lblRosterStatus:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(34, 106, 74, 1)
            Fill: =RGBA(204, 232, 219, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =26
            PaddingBottom: =0
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =0
            Size: =11
            Text: ="Window " & gblSelectedWindow.WindowStatus
            VerticalAlign: =VerticalAlign.Middle
            Visible: =gblCanEdit And gblRosterLoaded
            Width: =220
            X: =24
            Y: =62
      - lblReadOnlyBadge:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(178, 51, 71, 1)
            Fill: =RGBA(252, 237, 239, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =26
            PaddingBottom: =0
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =0
            Size: =11
            Text: |-
              ="Read-only"
            VerticalAlign: =VerticalAlign.Middle
            Visible: =!gblCanEdit And gblRosterLoaded
            Width: =200
            X: =24
            Y: =62
      - lblRosterMeta:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            Height: =26
            Size: =12
            Text: |-
              =CountRows(colRoster) & " students" & If(CountRows(colDirty) > 0, " · " & CountRows(colDirty) & " unsaved", "")
            VerticalAlign: =VerticalAlign.Middle
            Visible: =gblRosterLoaded
            Width: =360
            X: =Parent.Width - 384
            Y: =62
      - lblHdrRosterStudent:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =11
            Text: ="Student"
            Visible: =gblRosterLoaded
            Width: =200
            X: =72
            Y: =100
      - lblHdrRosterExpected:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =11
            Text: ="Expected"
            Visible: =gblRosterLoaded
            Width: =180
            X: =282
            Y: =100
      - lblHdrRosterExisting:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =11
            Text: ="Existing"
            Visible: =gblRosterLoaded
            Width: =130
            X: =472
            Y: =100
      - lblHdrRosterDifference:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =11
            Text: ="Difference"
            Visible: =gblRosterLoaded
            Width: =100
            X: =600
            Y: =100
      - lblHdrRosterNewLevel:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =11
            Text: ="New Level"
            Visible: =gblRosterLoaded
            Width: =180
            X: =710
            Y: =100
      - lblHdrRosterAchievement:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =11
            Text: ="Achievement"
            Visible: =gblRosterLoaded
            Width: =160
            X: =920
            Y: =100
      - galRoster:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(228, 234, 237, 1)
            Height: =Parent.Height - Self.Y - 80
            Items: =colRoster
            TemplateSize: =56
            Visible: =gblRosterLoaded
            Width: =Parent.Width - 80
            X: =40
            Y: =124
          Children:
            - recRowBackgroundRoster:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: |
                    =With(
                        { pendingOrder: If(IsBlank(cmbNewLevel.Selected), Blank(), cmbNewLevel.Selected.LevelOrder),
                          expMin:       ThisItem.ExpectedMinOrder,
                          expMax:       ThisItem.ExpectedMaxOrder },
                        With(
                            { d:
                                If(Not(IsBlank(pendingOrder)) And Not(IsBlank(expMin)) And Not(IsBlank(expMax)),
                                    If(pendingOrder >= expMin And pendingOrder <= expMax, 0,
                                        If(pendingOrder < expMin, pendingOrder - expMin, pendingOrder - expMax)),
                                    ThisItem.ExistingDelta) },
                            If(ThisItem.ReadingIPPStatus = true Or ThisItem.ReadingIPPNeedsConfirmation Or IsBlank(d),
                                RGBA(0, 0, 0, 0),
                                ColorValue(
                                    LookUp(colAchievementLevels,
                                        (IsBlank(LowerBound) Or
                                            (LowerOp = ">=" And d >= LowerBound) Or
                                            (LowerOp = ">"  And d >  LowerBound) Or
                                            (LowerOp = "="  And d =  LowerBound))
                                        And
                                        (IsBlank(UpperBound) Or
                                            (UpperOp = "<=" And d <= UpperBound) Or
                                            (UpperOp = "<"  And d <  UpperBound) Or
                                            (UpperOp = "="  And d =  UpperBound))
                                        And ActiveFlag = true
                                    ).HexColorTint)))
                    )
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
            - Image1Roster:
                Control: Image@2.2.3
                Properties:
                  Height: =1
                  Visible: =false
                  Width: =1
            - lblStudentName:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(24, 43, 52, 1)
                  Font: =Font.Lato
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  PaddingLeft: =12
                  Size: =14
                  Text: =ThisItem.LastName & ", " & ThisItem.FirstName
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =200
                  X: =20
                  Y: =0
            - lblRosterExpected:
                Control: Label@2.5.1
                Properties:
                  Color: |
                    =If(ThisItem.ReadingIPPNeedsConfirmation, RGBA(178, 51, 71, 1),
                        ThisItem.ReadingIPPStatus = true, RGBA(24, 43, 52, 1),
                        RGBA(110, 126, 134, 1))
                  Font: =Font.Lato
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  PaddingLeft: =12
                  Size: =12
                  Text: |
                    =If(ThisItem.ReadingIPPNeedsConfirmation, "Confirm IPP:",
                        ThisItem.ReadingIPPStatus = true, "IPP",
                        "Expected: " & Coalesce(ThisItem.ExpectedMinLevel, "?") & "-" & Coalesce(ThisItem.ExpectedMaxLevel, "?"))
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =180
                  X: =230
                  Y: =0
            - lblExistingLevel:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(110, 126, 134, 1)
                  Font: =Font.Lato
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  PaddingLeft: =12
                  Size: =12
                  Text: |
                    ="Existing: " & Coalesce(ThisItem.ExistingScaleValue, "—")
                  VerticalAlign: =VerticalAlign.Middle
                  Visible: =Not(ThisItem.ReadingIPPNeedsConfirmation)
                  Width: =130
                  X: =420
                  Y: =0
            - lblDifference:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Left
                  Color: =RGBA(24, 43, 52, 1)
                  Font: =Font.Lato
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  Size: =13
                  Text: |
                    =With(
                        { pendingOrder: If(IsBlank(cmbNewLevel.Selected), Blank(), cmbNewLevel.Selected.LevelOrder),
                          expMin:       ThisItem.ExpectedMinOrder,
                          expMax:       ThisItem.ExpectedMaxOrder },
                        With(
                            { d:
                                If(Not(IsBlank(pendingOrder)) And Not(IsBlank(expMin)) And Not(IsBlank(expMax)),
                                    If(pendingOrder >= expMin And pendingOrder <= expMax, 0,
                                        If(pendingOrder < expMin, pendingOrder - expMin, pendingOrder - expMax)),
                                    ThisItem.ExistingDelta) },
                            If(ThisItem.ReadingIPPStatus = true, "IPP",
                               ThisItem.ReadingIPPNeedsConfirmation, "—",
                               IsBlank(d), "—",
                               d > 0, "+" & Text(d),
                               Text(d)))
                    )
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =70
                  X: =560
                  Y: =0
            - cmbNewLevel:
                Control: ModernCombobox@1.1.0
                Properties:
                  DefaultSelectedItems: =Blank()
                  DisplayMode: =If(gblCanEdit, DisplayMode.Edit, DisplayMode.View)
                  Height: =40
                  InputTextPlaceholder: ="Select Reading Level"
                  ItemDisplayText: =ThisItem.LevelCode
                  Items: =SortByColumns(Filter(vw_DimReadingScale, ScaleSystem = gblSelectedWindow.ScaleSystem And ActiveFlag = true), "LevelOrder", SortOrder.Ascending)
                  OnChange: |
                    =If(
                        IsBlank(cmbNewLevel.Selected),
                        Remove(colDirty, LookUp(colDirty, StudentNumber = ThisItem.StudentNumber)),
                        cmbNewLevel.Selected.ReadingScaleID = ThisItem.ExistingReadingScaleID,
                        Remove(colDirty, LookUp(colDirty, StudentNumber = ThisItem.StudentNumber));
                        Reset(cmbNewLevel),
                        Remove(colDirty, LookUp(colDirty, StudentNumber = ThisItem.StudentNumber));
                        Collect(colDirty, {
                            StudentNumber:  ThisItem.StudentNumber,
                            ReadingScaleID: cmbNewLevel.Selected.ReadingScaleID,
                            LevelCode:      cmbNewLevel.Selected.LevelCode
                        })
                    )
                  SelectMultiple: =false
                  Visible: =Not(ThisItem.ReadingIPPNeedsConfirmation)
                  Width: =180
                  X: =670
                  Y: =(Parent.TemplateHeight - Self.Height) / 2
            - btnInlineIPPYes:
                Control: Classic/Button@2.2.0
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  Fill: =RGBA(0, 146, 201, 1)
                  Font: =Font.Lato
                  Height: =36
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(0, 122, 168, 1)
                  OnSelect: |
                    =Assessment_Warehouse.dbouspUpsertStudentIPP({
                        StudentKey:    ThisItem.StudentKey,
                        Subject:       "Reading",
                        ProgramFamily: ThisItem.ProgramFamily,
                        IsIPP:         1
                    });
                    Set(gblRosterLoaded, false);
                    Refresh(vw_TeacherRoster);
                    ClearCollect(colRoster, SortByColumns(Filter(vw_TeacherRoster, AssessmentWindowID = gblSelectedWindow.AssessmentWindowID And GroupKey = gblSelectedGroup.GroupKey), "LastName", SortOrder.Ascending, "FirstName", SortOrder.Ascending));
                    Set(gblRosterLoaded, true)
                  PressedColor: =RGBA(255, 255, 255, 1)
                  PressedFill: =RGBA(0, 122, 168, 1)
                  Size: =12
                  Text: ="Yes (IPP)"
                  Visible: =ThisItem.ReadingIPPNeedsConfirmation
                  Width: =95
                  X: =670
                  Y: =(Parent.TemplateHeight - Self.Height) / 2
            - btnInlineIPPNo:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(228, 234, 237, 1)
                  BorderThickness: =1
                  Color: =RGBA(3, 108, 146, 1)
                  Fill: =RGBA(255, 255, 255, 1)
                  Font: =Font.Lato
                  Height: =36
                  HoverColor: =RGBA(3, 108, 146, 1)
                  HoverFill: =RGBA(244, 247, 249, 1)
                  OnSelect: |
                    =Assessment_Warehouse.dbouspUpsertStudentIPP({
                        StudentKey:    ThisItem.StudentKey,
                        Subject:       "Reading",
                        ProgramFamily: ThisItem.ProgramFamily,
                        IsIPP:         0
                    });
                    Set(gblRosterLoaded, false);
                    Refresh(vw_TeacherRoster);
                    ClearCollect(colRoster, SortByColumns(Filter(vw_TeacherRoster, AssessmentWindowID = gblSelectedWindow.AssessmentWindowID And GroupKey = gblSelectedGroup.GroupKey), "LastName", SortOrder.Ascending, "FirstName", SortOrder.Ascending));
                    Set(gblRosterLoaded, true)
                  PressedColor: =RGBA(3, 108, 146, 1)
                  PressedFill: =RGBA(230, 244, 250, 1)
                  Size: =12
                  Text: ="No"
                  Visible: =ThisItem.ReadingIPPNeedsConfirmation
                  Width: =95
                  X: =775
                  Y: =(Parent.TemplateHeight - Self.Height) / 2
            - lblAchievementName:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(24, 43, 52, 1)
                  Font: =Font.Lato
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  Size: =12
                  Text: |
                    =With(
                        { pendingOrder: If(IsBlank(cmbNewLevel.Selected), Blank(), cmbNewLevel.Selected.LevelOrder),
                          expMin:       ThisItem.ExpectedMinOrder,
                          expMax:       ThisItem.ExpectedMaxOrder },
                        With(
                            { d:
                                If(Not(IsBlank(pendingOrder)) And Not(IsBlank(expMin)) And Not(IsBlank(expMax)),
                                    If(pendingOrder >= expMin And pendingOrder <= expMax, 0,
                                        If(pendingOrder < expMin, pendingOrder - expMin, pendingOrder - expMax)),
                                    ThisItem.ExistingDelta) },
                            If(ThisItem.ReadingIPPStatus = true Or ThisItem.ReadingIPPNeedsConfirmation Or IsBlank(d),
                                "",
                                Coalesce(
                                    LookUp(colAchievementLevels,
                                        (IsBlank(LowerBound) Or
                                            (LowerOp = ">=" And d >= LowerBound) Or
                                            (LowerOp = ">"  And d >  LowerBound) Or
                                            (LowerOp = "="  And d =  LowerBound))
                                        And
                                        (IsBlank(UpperBound) Or
                                            (UpperOp = "<=" And d <= UpperBound) Or
                                            (UpperOp = "<"  And d <  UpperBound) Or
                                            (UpperOp = "="  And d =  UpperBound))
                                        And ActiveFlag = true
                                    ).AchievementLevelName, "")))
                    )
                  VerticalAlign: =VerticalAlign.Middle
                  Visible: =Not(ThisItem.ReadingIPPNeedsConfirmation)
                  Width: =160
                  X: =880
                  Y: =0
            - icoDirty:
                Control: Classic/Icon@2.5.0
                Properties:
                  Color: =RGBA(34, 106, 74, 1)
                  Height: =28
                  Icon: =Icon.Check
                  OnSelect: =Select(Parent)
                  Visible: =!IsBlank(LookUp(colDirty, StudentNumber = ThisItem.StudentNumber))
                  Width: =28
                  X: =Parent.TemplateWidth - 80
                  Y: =(Parent.TemplateHeight - Self.Height) / 2
            - icoDelete:
                Control: Classic/Icon@2.5.0
                Properties:
                  Color: =RGBA(178, 51, 71, 1)
                  Height: =28
                  Icon: =Icon.Trash
                  OnSelect: |
                    =UpdateContext({
                        ctxShowDeleteConfirm:   true,
                        ctxDeleteStudentNumber: ThisItem.StudentNumber,
                        ctxDeleteStudentName:   ThisItem.FirstName & " " & ThisItem.LastName,
                        ctxDeleteLevelCode:     ThisItem.ExistingScaleValue
                    })
                  Visible: =Not(IsBlank(ThisItem.ExistingReadingScaleID)) And gblCanEdit And Not(ThisItem.ReadingIPPNeedsConfirmation)
                  Width: =28
                  X: =Parent.TemplateWidth - 40
                  Y: =(Parent.TemplateHeight - Self.Height) / 2
            - NextArrowRoster:
                Control: Classic/Icon@2.5.0
                Properties:
                  Height: =1
                  Icon: =Icon.ChevronRight
                  OnSelect: =Select(Parent)
                  Visible: =false
                  Width: =1
            - SeparatorRoster:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(212, 221, 226, 1)
                  Height: =1
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - Self.Height
            - SelectionBarRoster:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 146, 201, 1)
                  Height: =1
                  OnSelect: =Select(Parent)
                  Visible: =false
                  Width: =1
      - lblLoadingRoster:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            Height: =40
            Size: =14
            Text: ="Loading roster…"
            Visible: =Not(gblRosterLoaded)
            Width: =Parent.Width - 80
            X: =40
            Y: =(Parent.Height - Self.Height) / 2
      - lblEmptyRoster:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            Height: =40
            Size: =14
            Text: ="No applicable students in this group for this window."
            Visible: =gblRosterLoaded And CountRows(colRoster) = 0
            Width: =Parent.Width - 80
            X: =40
            Y: =(Parent.Height - Self.Height) / 2
      - btnSaveBottom:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =If(CountRows(colDirty) = 0, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(0, 146, 201, 1)
            Font: =Font.Lato
            Height: =44
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 122, 168, 1)
            OnSelect: |
              =ForAll(colDirty,
                  Assessment_Warehouse.dbouspUpsertReadingAssessment({
                      StudentNumber:      ThisRecord.StudentNumber,
                      AssessmentWindowID: Text(gblSelectedWindow.AssessmentWindowID),
                      ReadingScaleID:     Text(ThisRecord.ReadingScaleID),
                      AssessmentDate:     Today()
                  })
              );
              Notify("Saved " & CountRows(colDirty) & " assessment" & If(CountRows(colDirty) = 1, "", "s"), NotificationType.Success);
              Clear(colDirty);
              Set(gblRosterLoaded, false);
              Refresh(vw_TeacherRoster);
              ClearCollect(colRoster, SortByColumns(Filter(vw_TeacherRoster, AssessmentWindowID = gblSelectedWindow.AssessmentWindowID And GroupKey = gblSelectedGroup.GroupKey), "LastName", SortOrder.Ascending, "FirstName", SortOrder.Ascending));
              Set(gblRosterLoaded, true);
              Reset(galRoster)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 122, 168, 1)
            Size: =14
            Text: |-
              ="Save " & CountRows(colDirty) & If(CountRows(colDirty) = 1, " change", " changes")
            Visible: =gblCanEdit And gblRosterLoaded
            Width: =220
            X: =(Parent.Width - 220) / 2
            Y: =Parent.Height - 60
      - lblReadOnlyExplain:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            Height: =44
            Text: ="This window closed on " & Text(gblSelectedWindow.EndDate, "mmm d yyyy") & ". Contact a school admin if changes are needed."
            Visible: =!gblCanEdit And gblRosterLoaded
            Width: =Parent.Width - 80
            X: =40
            Y: =Parent.Height - 60
      - recUnsavedOverlay:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0.4)
            Height: =Parent.Height
            Visible: =ctxShowUnsavedConfirm
            Width: =Parent.Width
      - recUnsavedModal:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(228, 234, 237, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =200
            Visible: =ctxShowUnsavedConfirm
            Width: =460
            X: =(Parent.Width - 460) / 2
            Y: =(Parent.Height - 200) / 2
      - lblUnsavedConfirmText:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
