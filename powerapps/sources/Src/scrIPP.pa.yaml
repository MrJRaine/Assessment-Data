# ── Direction B restyle (Edge-to-Edge) ──────────────────────────────────────
# Visual-only restyle. UNTOUCHED: OnVisible, the dbouspUpsertStudentIPP save,
# data-bindings, Items, modal flow — all verified identical to the prior live
# screen. EXCEPTION (2026-06-10 functional change, not restyle): the Yes/No
# action cluster is now a segmented toggle shown on EVERY row (previously the
# buttons were Visible only on needs-confirmation rows), so a confirmed IPP can
# be changed when a student's status changes — Yes->No removes the IPP. The
# underlying proc already supports the flip; NULL-reset stays unsupported.
# Sort hint (lblIPPSortHint) added at Y=96; header row + gallery shifted +24px.
#
# Loading-state fix (2026-06-09): the need-pill, subtitle, 6 column headers, and
# both save buttons are gated Visible: =gblIPPLoaded so they don't ghost over the
# "Loading IPP cells…" label before the lookup resolves. Back chevron + title stay
# always-on (header chrome / escape hatch).
#
# Responsive grid (2026-06-09): columns are fixed-minimum + proportional-growth.
# The row floor is ~756px template width (~796 screen). Below that, columns hold
# their minimums (tight but everything stays on screen); above it, the extra width
# is shared 40/35/25 across Name/Subject/Status while Grade, Homeroom and the
# right-anchored Yes/No/✓ action cluster stay fixed. Headers use identical math so
# they track the cells. Save buttons / subtitle / panels are Parent.Width-relative.
# ─────────────────────────────────────────────────────────────────────────────
Screens:
  scrIPP:
    Properties:
      Fill: =RGBA(0, 146, 201, 1)
      LoadingSpinnerColor: =RGBA(255, 255, 255, 1)
      OnVisible: |
        =Set(gblIPPLoaded, false);
        Set(gblIPPSortCol, "Name");
        Set(gblIPPSortAsc, true);
        ClearCollect(colDirtyIPP, { _SK: "", _Subj: "", _PF: "", IsIPP: false });
        Clear(colDirtyIPP);
        Clear(colRawIPP);
        Refresh(vw_StudentIPP);
        ClearCollect(colRawIPP,
            SortByColumns(
                Filter(vw_StudentIPP, Subject = "Reading"),
                "LastName",         SortOrder.Ascending,
                "FirstName",        SortOrder.Ascending,
                "IPPProgramFamily", SortOrder.Ascending
            )
        );
        Set(gblIPPLoaded, true)
    Children:
      - recContentPanelIPP:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height - 52
            Width: =Parent.Width
            X: =0
            Y: =52
      - icoBackToLandingIPP:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =32
            Icon: =Icon.ChevronLeft
            OnSelect: |
              =If(CountRows(colDirtyIPP) > 0, UpdateContext({ ctxShowUnsavedIPPConfirm: true }), Navigate(scrLanding, ScreenTransition.Fade))
            Width: =32
            X: =16
            Y: =10
      - lblIPPTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Lato Black'
            Height: =32
            Size: =17
            Text: ="IPP Subject Confirmation"
            Width: =800
            X: =56
            Y: =14
      - btnSaveTopIPP:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(228, 234, 237, 1)
            BorderThickness: =1
            Color: =RGBA(3, 108, 146, 1)
            DisplayMode: =If(CountRows(colDirtyIPP) = 0, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.Lato
            Height: =32
            HoverColor: =RGBA(3, 108, 146, 1)
            HoverFill: =RGBA(244, 247, 249, 1)
            OnSelect: =Select(btnSaveBottomIPP)
            PressedColor: =RGBA(3, 108, 146, 1)
            PressedFill: =RGBA(230, 244, 250, 1)
            Size: =13
            Text: |-
              ="Save " & CountRows(colDirtyIPP) & If(CountRows(colDirtyIPP) = 1, " change", " changes")
            Visible: =gblIPPLoaded
            Width: =200
            X: =Parent.Width - 216
            Y: =10
      - lblIPPNeedPill:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(178, 51, 71, 1)
            Fill: =RGBA(252, 237, 239, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =26
            PaddingBottom: =0
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =0
            Size: =11
            Text: |-
              =CountRows(Filter(colRawIPP, IsBlank(IsIPP))) & " of " & CountRows(colRawIPP) & " still need confirmation"
            VerticalAlign: =VerticalAlign.Middle
            Visible: =gblIPPLoaded
            Width: =280
            X: =24
            Y: =66
      - lblIPPSubtitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            Height: =26
            Size: =12
            Text: ="Confirm each IPP subject so assessment data is interpreted correctly."
            VerticalAlign: =VerticalAlign.Middle
            Visible: =gblIPPLoaded
            Width: =Max(200, Parent.Width - 340)
            X: =316
            Y: =66
      - lblIPPSortHint:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(3, 108, 146, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =12
            Text: |
              ="↕  Tip: click any column heading to sort the list — click it again to reverse the order."
            VerticalAlign: =VerticalAlign.Middle
            Visible: =gblIPPLoaded
            Width: =Parent.Width - 48
            X: =24
            Y: =96
      - lblIPPHdrName:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =24
            OnSelect: =Set(gblIPPSortAsc, If(gblIPPSortCol = "Name", Not(gblIPPSortAsc), true)); Set(gblIPPSortCol, "Name")
            Size: =11
            Text: ="Student"
            Visible: =gblIPPLoaded
            Width: =150 + Max(0, Parent.Width - 828) * 0.4
            X: =36
            Y: =128
      - arrIPPHdrName:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =If(gblIPPSortCol = "Name", RGBA(3, 108, 146, 1), RGBA(170, 180, 186, 1))
            Font: =Font.Lato
            Height: =24
            OnSelect: =Set(gblIPPSortAsc, If(gblIPPSortCol = "Name", Not(gblIPPSortAsc), true)); Set(gblIPPSortCol, "Name")
            Size: =11
            Text: =If(gblIPPSortCol = "Name", If(gblIPPSortAsc, "↑", "↓"), "↕")
            Visible: =gblIPPLoaded
            Width: =16
            X: =lblIPPHdrName.X + 66
            Y: =128
      - lblIPPHdrGrade:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =24
            OnSelect: =Set(gblIPPSortAsc, If(gblIPPSortCol = "Grade", Not(gblIPPSortAsc), true)); Set(gblIPPSortCol, "Grade")
            Size: =11
            Text: ="Grade"
            Visible: =gblIPPLoaded
            Width: =68
            X: =lblIPPHdrName.X + lblIPPHdrName.Width
            Y: =128
      - arrIPPHdrGrade:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =If(gblIPPSortCol = "Grade", RGBA(3, 108, 146, 1), RGBA(170, 180, 186, 1))
            Font: =Font.Lato
            Height: =24
            OnSelect: =Set(gblIPPSortAsc, If(gblIPPSortCol = "Grade", Not(gblIPPSortAsc), true)); Set(gblIPPSortCol, "Grade")
            Size: =11
            Text: =If(gblIPPSortCol = "Grade", If(gblIPPSortAsc, "↑", "↓"), "↕")
            Visible: =gblIPPLoaded
            Width: =16
            X: =lblIPPHdrGrade.X + 52
            Y: =128
      - lblIPPHdrHR:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =24
            OnSelect: =Set(gblIPPSortAsc, If(gblIPPSortCol = "HR", Not(gblIPPSortAsc), true)); Set(gblIPPSortCol, "HR")
            Size: =11
            Text: ="Homeroom"
            Visible: =gblIPPLoaded
            Width: =104
            X: =lblIPPHdrGrade.X + lblIPPHdrGrade.Width
            Y: =128
      - arrIPPHdrHR:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =If(gblIPPSortCol = "HR", RGBA(3, 108, 146, 1), RGBA(170, 180, 186, 1))
            Font: =Font.Lato
            Height: =24
            OnSelect: =Set(gblIPPSortAsc, If(gblIPPSortCol = "HR", Not(gblIPPSortAsc), true)); Set(gblIPPSortCol, "HR")
            Size: =11
            Text: =If(gblIPPSortCol = "HR", If(gblIPPSortAsc, "↑", "↓"), "↕")
            Visible: =gblIPPLoaded
            Width: =16
            X: =lblIPPHdrHR.X + 86
            Y: =128
      - lblIPPHdrSubject:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =24
            OnSelect: =Set(gblIPPSortAsc, If(gblIPPSortCol = "Subject", Not(gblIPPSortAsc), true)); Set(gblIPPSortCol, "Subject")
            Size: =11
            Text: ="IPP Subject"
            Visible: =gblIPPLoaded
            Width: =124 + Max(0, Parent.Width - 828) * 0.35
            X: =lblIPPHdrHR.X + lblIPPHdrHR.Width
            Y: =128
      - arrIPPHdrSubject:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =If(gblIPPSortCol = "Subject", RGBA(3, 108, 146, 1), RGBA(170, 180, 186, 1))
            Font: =Font.Lato
            Height: =24
            OnSelect: =Set(gblIPPSortAsc, If(gblIPPSortCol = "Subject", Not(gblIPPSortAsc), true)); Set(gblIPPSortCol, "Subject")
            Size: =11
            Text: =If(gblIPPSortCol = "Subject", If(gblIPPSortAsc, "↑", "↓"), "↕")
            Visible: =gblIPPLoaded
            Width: =16
            X: =lblIPPHdrSubject.X + 96
            Y: =128
      - lblIPPHdrState:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =24
            OnSelect: =Set(gblIPPSortAsc, If(gblIPPSortCol = "Status", Not(gblIPPSortAsc), true)); Set(gblIPPSortCol, "Status")
            Size: =11
            Text: ="Status"
            Visible: =gblIPPLoaded
            Width: =110 + Max(0, Parent.Width - 828) * 0.25
            X: =lblIPPHdrSubject.X + lblIPPHdrSubject.Width
            Y: =128
      - arrIPPHdrState:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =If(gblIPPSortCol = "Status", RGBA(3, 108, 146, 1), RGBA(170, 180, 186, 1))
            Font: =Font.Lato
            Height: =24
            OnSelect: =Set(gblIPPSortAsc, If(gblIPPSortCol = "Status", Not(gblIPPSortAsc), true)); Set(gblIPPSortCol, "Status")
            Size: =11
            Text: =If(gblIPPSortCol = "Status", If(gblIPPSortAsc, "↑", "↓"), "↕")
            Visible: =gblIPPLoaded
            Width: =16
            X: =lblIPPHdrState.X + 58
            Y: =128
      - lblIPPHdrAction:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =11
            Text: ="Action"
            Visible: =gblIPPLoaded
            Width: =200
            X: =Parent.Width - 224
            Y: =128
      - galStudentsIPP:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(228, 234, 237, 1)
            Height: =Parent.Height - Self.Y - 80
            Items: |
              =With({ ord: If(gblIPPSortAsc, SortOrder.Ascending, SortOrder.Descending) },
                  Switch(gblIPPSortCol,
                      "Grade",   SortByColumns(colRawIPP, "Grade", ord),
                      "HR",      SortByColumns(colRawIPP, "Homeroom", ord),
                      "Subject", SortByColumns(colRawIPP, "IPPProgramFamily", ord, "Subject", ord),
                      "Status",  SortByColumns(colRawIPP, "IsIPP", ord),
                      SortByColumns(colRawIPP, "LastName", ord, "FirstName", ord)
                  )
              )
            TemplateSize: =48
            Visible: =gblIPPLoaded
            Width: =Parent.Width - 40
            X: =20
            Y: =156
          Children:
            - Image1IPP:
                Control: Image@2.2.3
                Properties:
                  Height: =1
                  Visible: =false
                  Width: =1
            - lblIPPStudentName:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(24, 43, 52, 1)
                  Font: =Font.Lato
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  PaddingLeft: =8
                  Size: =13
                  Text: =ThisItem.LastName & ", " & ThisItem.FirstName
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =150 + Max(0, Parent.TemplateWidth - 788) * 0.4
                  X: =16
                  Y: =0
            - lblIPPStudentGrade:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(74, 91, 100, 1)
                  Font: =Font.Lato
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  Size: =13
                  Text: =ThisItem.Grade
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =68
                  X: =lblIPPStudentName.X + lblIPPStudentName.Width
                  Y: =0
            - lblIPPStudentHomeroom:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(74, 91, 100, 1)
                  Font: =Font.Lato
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  Size: =13
                  Text: =Coalesce(ThisItem.Homeroom, "—")
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =104
                  X: =lblIPPStudentGrade.X + lblIPPStudentGrade.Width
                  Y: =0
            - lblIPPSubjectLabel:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(74, 91, 100, 1)
                  Font: =Font.Lato
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  Size: =13
                  Text: |
                    =If(ThisItem.IPPProgramFamily = "French Immersion", "French", "English") & " " & ThisItem.Subject
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =124 + Max(0, Parent.TemplateWidth - 788) * 0.35
                  X: =lblIPPStudentHomeroom.X + lblIPPStudentHomeroom.Width
                  Y: =0
            - lblIPPState:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Left
                  Color: |
                    =With({pending: LookUp(colDirtyIPP, _SK = ThisItem.StudentKey And _Subj = ThisItem.Subject And _PF = ThisItem.IPPProgramFamily)},
                        If(!IsBlank(pending), RGBA(3, 108, 146, 1),
                            IsBlank(ThisItem.IsIPP), RGBA(178, 51, 71, 1),
                            ThisItem.IsIPP, RGBA(34, 106, 74, 1),
                            RGBA(110, 126, 134, 1))
                    )
                  Font: =Font.Lato
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  Size: =13
                  Text: |
                    =With({pending: LookUp(colDirtyIPP, _SK = ThisItem.StudentKey And _Subj = ThisItem.Subject And _PF = ThisItem.IPPProgramFamily)},
                        If(!IsBlank(pending), If(pending.IsIPP, "Yes (pending)", "No (pending)"),
                            IsBlank(ThisItem.IsIPP), "Needs confirmation",
                            ThisItem.IsIPP, "Yes (IPP)",
                            "No"
                        )
                    )
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =110 + Max(0, Parent.TemplateWidth - 788) * 0.25
                  X: =lblIPPSubjectLabel.X + lblIPPSubjectLabel.Width
                  Y: =0
            # Segmented Yes/No toggle — shown on EVERY row (not just unconfirmed)
            # so a confirmed IPP can be changed if the student's status changes
            # (Yes->No removes the IPP; No->Yes adds it). Selected state = green
            # (Yes) / grey (No) fill, matching the status-label colors; unselected
            # = white outline; a needs-confirmation row shows neither selected.
            # Re-clicking the stored value just drops the pending change (revert).
            # Blank-safe selection via nested With (Blank() = false coerces, so an
            # unconfirmed row must be guarded with Not(IsBlank(e)), not "e = false").
            - btnIPPYes:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(228, 234, 237, 1)
                  BorderThickness: =1
                  Color: |
                    =With(
                        { e: With({ p: LookUp(colDirtyIPP, _SK = ThisItem.StudentKey And _Subj = ThisItem.Subject And _PF = ThisItem.IPPProgramFamily) }, If(!IsBlank(p), p.IsIPP, ThisItem.IsIPP)) },
                        If(Not(IsBlank(e)) And e, RGBA(255, 255, 255, 1), RGBA(3, 108, 146, 1))
                    )
                  Fill: |
                    =With(
                        { e: With({ p: LookUp(colDirtyIPP, _SK = ThisItem.StudentKey And _Subj = ThisItem.Subject And _PF = ThisItem.IPPProgramFamily) }, If(!IsBlank(p), p.IsIPP, ThisItem.IsIPP)) },
                        If(Not(IsBlank(e)) And e, RGBA(34, 106, 74, 1), RGBA(255, 255, 255, 1))
                    )
                  Font: =Font.Lato
                  Height: =36
                  HoverColor: =RGBA(3, 108, 146, 1)
                  HoverFill: =RGBA(244, 247, 249, 1)
                  OnSelect: |
                    =Remove(colDirtyIPP,
                        LookUp(colDirtyIPP,
                            _SK = ThisItem.StudentKey And
                            _Subj = ThisItem.Subject And
                            _PF = ThisItem.IPPProgramFamily
                        )
                    );
                    If(IsBlank(ThisItem.IsIPP) Or Not(ThisItem.IsIPP),
                        Collect(colDirtyIPP, {
                            _SK:   ThisItem.StudentKey,
                            _Subj: ThisItem.Subject,
                            _PF:   ThisItem.IPPProgramFamily,
                            IsIPP: true
                        })
                    )
                  PressedColor: =RGBA(3, 108, 146, 1)
                  PressedFill: =RGBA(230, 244, 250, 1)
                  Size: =12
                  Text: ="Yes (IPP)"
                  Width: =88
                  X: =Parent.TemplateWidth - 204
                  Y: =(Parent.TemplateHeight - Self.Height) / 2
            - btnIPPNo:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(228, 234, 237, 1)
                  BorderThickness: =1
                  Color: |
                    =With(
                        { e: With({ p: LookUp(colDirtyIPP, _SK = ThisItem.StudentKey And _Subj = ThisItem.Subject And _PF = ThisItem.IPPProgramFamily) }, If(!IsBlank(p), p.IsIPP, ThisItem.IsIPP)) },
                        If(Not(IsBlank(e)) And Not(e), RGBA(255, 255, 255, 1), RGBA(3, 108, 146, 1))
                    )
                  Fill: |
                    =With(
                        { e: With({ p: LookUp(colDirtyIPP, _SK = ThisItem.StudentKey And _Subj = ThisItem.Subject And _PF = ThisItem.IPPProgramFamily) }, If(!IsBlank(p), p.IsIPP, ThisItem.IsIPP)) },
                        If(Not(IsBlank(e)) And Not(e), RGBA(110, 126, 134, 1), RGBA(255, 255, 255, 1))
                    )
                  Font: =Font.Lato
                  Height: =36
                  HoverColor: =RGBA(3, 108, 146, 1)
                  HoverFill: =RGBA(244, 247, 249, 1)
                  OnSelect: |
                    =Remove(colDirtyIPP,
                        LookUp(colDirtyIPP,
                            _SK = ThisItem.StudentKey And
                            _Subj = ThisItem.Subject And
                            _PF = ThisItem.IPPProgramFamily
                        )
                    );
                    If(IsBlank(ThisItem.IsIPP) Or ThisItem.IsIPP,
                        Collect(colDirtyIPP, {
                            _SK:   ThisItem.StudentKey,
                            _Subj: ThisItem.Subject,
                            _PF:   ThisItem.IPPProgramFamily,
                            IsIPP: false
                        })
                    )
                  PressedColor: =RGBA(3, 108, 146, 1)
                  PressedFill: =RGBA(230, 244, 250, 1)
                  Size: =12
                  Text: ="No"
                  Width: =60
                  X: =Parent.TemplateWidth - 108
                  Y: =(Parent.TemplateHeight - Self.Height) / 2
            - icoIPPDirty:
                Control: Classic/Icon@2.5.0
                Properties:
                  Color: =RGBA(34, 106, 74, 1)
                  Height: =24
                  Icon: =Icon.Check
                  OnSelect: =Select(Parent)
                  Visible: |
                    =!IsBlank(LookUp(colDirtyIPP, _SK = ThisItem.StudentKey And _Subj = ThisItem.Subject And _PF = ThisItem.IPPProgramFamily))
                  Width: =24
                  X: =Parent.TemplateWidth - 40
                  Y: =(Parent.TemplateHeight - Self.Height) / 2
            - NextArrowIPP:
                Control: Classic/Icon@2.5.0
                Properties:
                  Height: =1
                  Icon: =Icon.ChevronRight
                  OnSelect: =Select(Parent)
                  Visible: =false
                  Width: =1
            - SeparatorIPP:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(212, 221, 226, 1)
                  Height: =1
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - Self.Height
            - SelectionBarIPP:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 146, 201, 1)
                  Height: =1
                  OnSelect: =Select(Parent)
                  Visible: =false
                  Width: =1
      - lblLoadingIPP:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            Height: =40
            Size: =14
            Text: ="Loading IPP cells…"
            Visible: =Not(gblIPPLoaded)
            Width: =Parent.Width - 48
            X: =24
            Y: =(Parent.Height - Self.Height) / 2
      - lblEmptyIPP:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            Height: =40
            Size: =14
            Text: ="No IPP cells in your scope."
            Visible: =gblIPPLoaded And CountRows(colRawIPP) = 0
            Width: =Parent.Width - 48
            X: =24
            Y: =(Parent.Height - Self.Height) / 2
      - btnSaveBottomIPP:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =If(CountRows(colDirtyIPP) = 0, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(0, 146, 201, 1)
            Font: =Font.Lato
            Height: =44
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 122, 168, 1)
            OnSelect: |
              =ForAll(colDirtyIPP As d,
                  Assessment_Warehouse.dbouspUpsertStudentIPP({
                      StudentKey:    d._SK,
                      Subject:       d._Subj,
                      ProgramFamily: d._PF,
                      IsIPP:         If(d.IsIPP, 1, 0)
                  })
              );
              Notify("Saved " & CountRows(colDirtyIPP) & " IPP confirmation" & If(CountRows(colDirtyIPP) = 1, "", "s"), NotificationType.Success);
              Clear(colDirtyIPP);
              Set(gblIPPLoaded, false);
              Refresh(vw_StudentIPP);
              ClearCollect(colRawIPP,
                  SortByColumns(
                      Filter(vw_StudentIPP, Subject = "Reading"),
                      "LastName",         SortOrder.Ascending,
                      "FirstName",        SortOrder.Ascending,
                      "IPPProgramFamily", SortOrder.Ascending
                  )
              );
              Set(gblIPPLoaded, true);
              Reset(galStudentsIPP)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 122, 168, 1)
            Size: =14
            Text: |-
              ="Save " & CountRows(colDirtyIPP) & If(CountRows(colDirtyIPP) = 1, " change", " changes")
            Visible: =gblIPPLoaded
            Width: =220
            X: =(Parent.Width - 220) / 2
            Y: =Parent.Height - 60
