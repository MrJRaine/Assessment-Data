Screens:
  scrIPP:
    Properties:
      Fill: =RGBA(0, 146, 201, 1)
      LoadingSpinnerColor: =RGBA(255, 255, 255, 1)
      OnVisible: |
        =Set(gblIPPLoaded, false);
        ClearCollect(colDirtyIPP, { _SK: "", _Subj: "", _PF: "", IsIPP: false });
        Clear(colDirtyIPP);
        Clear(colRawIPP);
        Refresh(vw_StudentIPP);
        ClearCollect(colRawIPP,
            SortByColumns(
                vw_StudentIPP,
                "LastName",         SortOrder.Ascending,
                "FirstName",        SortOrder.Ascending,
                "Subject",          SortOrder.Ascending,
                "IPPProgramFamily", SortOrder.Ascending
            )
        );
        Set(gblIPPLoaded, true)
    Children:
      - recContentPanelIPP:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height - 110
            Width: =Parent.Width - 40
            X: =20
            Y: =90
      - icoBackToLandingIPP:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =40
            Icon: =Icon.ChevronLeft
            OnSelect: |
              =If(CountRows(colDirtyIPP) > 0, UpdateContext({ ctxShowUnsavedIPPConfirm: true }), Navigate(scrLanding, ScreenTransition.Fade))
            Width: =40
            X: =20
            Y: =20
      - lblIPPTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Lato Black'
            Height: =36
            Size: =16
            Text: ="IPP Subject Confirmation"
            Width: =800
            X: =80
            Y: =20
      - lblIPPSubtitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 0.85)
            Font: =Font.Lato
            Height: =24
            Size: =12
            Text: |-
              ="Confirm each IPP subject so assessment data is interpreted correctly. " &
                CountRows(Filter(colRawIPP, IsBlank(IsIPP))) & " of " &
                CountRows(colRawIPP) & " cells still need confirmation."
            Width: =1000
            X: =80
            Y: =58
      - btnSaveTopIPP:
          Control: ModernButton@1.0.0
          Properties:
            DisplayMode: =If(CountRows(colDirtyIPP) = 0, DisplayMode.Disabled, DisplayMode.Edit)
            Height: =40
            OnSelect: =Select(btnSaveBottomIPP)
            Text: |-
              ="💾 Save " & CountRows(colDirtyIPP) & If(CountRows(colDirtyIPP) = 1, " change", " changes")
            Width: =220
            X: =1100
            Y: =20
      - lblIPPHdrName:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(96, 94, 92, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =11
            Text: ="Student"
            Width: =200
            X: =40
            Y: =100
      - lblIPPHdrGrade:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(96, 94, 92, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =11
            Text: ="Grade"
            Width: =60
            X: =250
            Y: =100
      - lblIPPHdrHR:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(96, 94, 92, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =11
            Text: ="Homeroom"
            Width: =100
            X: =320
            Y: =100
      - lblIPPHdrSubject:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(96, 94, 92, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =11
            Text: ="IPP Subject"
            Width: =180
            X: =430
            Y: =100
      - lblIPPHdrState:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(96, 94, 92, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =11
            Text: ="Status"
            Width: =160
            X: =620
            Y: =100
      - lblIPPHdrAction:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(96, 94, 92, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =11
            Text: ="Action (only shown when unconfirmed)"
            Width: =400
            X: =790
            Y: =100
      - galStudentsIPP:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height - Self.Y - 80
            Items: =colRawIPP
            TemplateSize: =48
            Visible: =gblIPPLoaded
            Width: =Parent.Width - 40
            X: =20
            Y: =130
          Children:
            - Image1IPP:
                Control: Image@2.2.3
                Properties:
                  Height: =1
                  Visible: =false
                  Width: =1
            - lblIPPStudentName:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(50, 49, 48, 1)
                  Font: =Font.Lato
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  PaddingLeft: =12
                  Size: =13
                  Text: =ThisItem.LastName & ", " & ThisItem.FirstName
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =200
                  X: =20
                  Y: =0
            - lblIPPStudentGrade:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(50, 49, 48, 1)
                  Font: =Font.Lato
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  Size: =13
                  Text: =ThisItem.Grade
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =60
                  X: =230
                  Y: =0
            - lblIPPStudentHomeroom:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(50, 49, 48, 1)
                  Font: =Font.Lato
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  Size: =13
                  Text: =Coalesce(ThisItem.Homeroom, "—")
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =100
                  X: =300
                  Y: =0
            - lblIPPSubjectLabel:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(50, 49, 48, 1)
                  Font: =Font.Lato
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  Size: =13
                  Text: |
                    =If(ThisItem.IPPProgramFamily = "French Immersion", "French", "English") & " " & ThisItem.Subject
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =180
                  X: =410
                  Y: =0
            - lblIPPState:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Left
                  Color: |
                    =With({pending: LookUp(colDirtyIPP, _SK = ThisItem.StudentKey And _Subj = ThisItem.Subject And _PF = ThisItem.IPPProgramFamily)},
                        If(!IsBlank(pending), RGBA(0, 120, 212, 1),
                            IsBlank(ThisItem.IsIPP), RGBA(180, 50, 50, 1),
                            ThisItem.IsIPP, RGBA(30, 130, 30, 1),
                            RGBA(96, 94, 92, 1))
                    )
                  Font: =Font.Lato
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  Size: =13
                  Text: |
                    =With({pending: LookUp(colDirtyIPP, _SK = ThisItem.StudentKey And _Subj = ThisItem.Subject And _PF = ThisItem.IPPProgramFamily)},
                        If(!IsBlank(pending), If(pending.IsIPP, "Yes (pending)", "No (pending)"),
                            IsBlank(ThisItem.IsIPP), "Confirm:",
                            ThisItem.IsIPP, "Yes (IPP)",
                            "No"
                        )
                    )
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =160
                  X: =600
                  Y: =0
            - btnIPPYes:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =36
                  OnSelect: |
                    =Remove(colDirtyIPP,
                        LookUp(colDirtyIPP,
                            _SK = ThisItem.StudentKey And
                            _Subj = ThisItem.Subject And
                            _PF = ThisItem.IPPProgramFamily
                        )
                    );
                    Collect(colDirtyIPP, {
                        _SK:   ThisItem.StudentKey,
                        _Subj: ThisItem.Subject,
                        _PF:   ThisItem.IPPProgramFamily,
                        IsIPP: true
                    })
                  Text: ="Yes (IPP)"
                  Visible: =IsBlank(ThisItem.IsIPP)
                  Width: =120
                  X: =770
                  Y: =(Parent.TemplateHeight - Self.Height) / 2
            - btnIPPNo:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =36
                  OnSelect: |
                    =Remove(colDirtyIPP,
                        LookUp(colDirtyIPP,
                            _SK = ThisItem.StudentKey And
                            _Subj = ThisItem.Subject And
                            _PF = ThisItem.IPPProgramFamily
                        )
                    );
                    Collect(colDirtyIPP, {
                        _SK:   ThisItem.StudentKey,
                        _Subj: ThisItem.Subject,
                        _PF:   ThisItem.IPPProgramFamily,
                        IsIPP: false
                    })
                  Text: ="No"
                  Visible: =IsBlank(ThisItem.IsIPP)
                  Width: =120
                  X: =900
                  Y: =(Parent.TemplateHeight - Self.Height) / 2
            - icoIPPDirty:
                Control: Classic/Icon@2.5.0
                Properties:
                  Color: =RGBA(30, 130, 30, 1)
                  Height: =24
                  Icon: =Icon.Check
                  OnSelect: =Select(Parent)
                  Visible: |
                    =!IsBlank(LookUp(colDirtyIPP, _SK = ThisItem.StudentKey And _Subj = ThisItem.Subject And _PF = ThisItem.IPPProgramFamily))
                  Width: =24
                  X: =1040
                  Y: =(Parent.TemplateHeight - Self.Height) / 2
            - NextArrowIPP:
                Control: Classic/Icon@2.5.0
                Properties:
                  Height: =1
                  Icon: =Icon.ChevronRight
                  OnSelect: =Select(Parent)
                  Visible: =false
                  Width: =1
            - SeparatorIPP:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(245, 245, 245, 1)
                  Height: =1
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - Self.Height
            - SelectionBarIPP:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 120, 212, 1)
                  Height: =1
                  OnSelect: =Select(Parent)
                  Visible: =false
                  Width: =1
      - lblLoadingIPP:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(96, 94, 92, 1)
            Font: =Font.Lato
            Height: =40
            Size: =14
            Text: ="Loading IPP cells…"
            Visible: =Not(gblIPPLoaded)
            Width: =1320
            X: =20
            Y: =(Parent.Height - Self.Height) / 2
      - lblEmptyIPP:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(96, 94, 92, 1)
            Font: =Font.Lato
            Height: =40
            Size: =14
            Text: ="No IPP cells in your scope."
            Visible: =gblIPPLoaded And CountRows(colRawIPP) = 0
            Width: =1320
            X: =20
            Y: =(Parent.Height - Self.Height) / 2
      - btnSaveBottomIPP:
          Control: ModernButton@1.0.0
          Properties:
            DisplayMode: =If(CountRows(colDirtyIPP) = 0, DisplayMode.Disabled, DisplayMode.Edit)
            Height: =44
            OnSelect: |
              =ForAll(colDirtyIPP As d,
                  Assessment_Warehouse.dbouspUpsertStudentIPP({
                      StudentKey:    d._SK,
                      Subject:       d._Subj,
                      ProgramFamily: d._PF,
                      IsIPP:         If(d.IsIPP, 1, 0)
                  })
              );
              Notify("Saved " & CountRows(colDirtyIPP) & " IPP confirmation" & If(CountRows(colDirtyIPP) = 1, "", "s"), NotificationType.Success);
              Clear(colDirtyIPP);
              Set(gblIPPLoaded, false);
              Refresh(vw_StudentIPP);
              ClearCollect(colRawIPP,
                  SortByColumns(
                      vw_StudentIPP,
                      "LastName",         SortOrder.Ascending,
                      "FirstName",        SortOrder.Ascending,
                      "Subject",          SortOrder.Ascending,
                      "IPPProgramFamily", SortOrder.Ascending
                  )
              );
              Set(gblIPPLoaded, true);
              Reset(galStudentsIPP)
            Text: |-
              ="💾 Save " & CountRows(colDirtyIPP) & If(CountRows(colDirtyIPP) = 1, " change", " changes")
            Width: =220
            X: =560
            Y: =Parent.Height - 60
      - recIPPUnsavedOverlay:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0.4)
            Height: =Parent.Height
            Visible: =ctxShowUnsavedIPPConfirm
            Width: =Parent.Width
      - recIPPUnsavedModal:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(200, 200, 200, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =200
            Visible: =ctxShowUnsavedIPPConfirm
            Width: =460
            X: =(Parent.Width - 460) / 2
            Y: =(Parent.Height - 200) / 2
      - lblIPPUnsavedConfirmText:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(50, 49, 48, 1)
            Font: =Font.Lato
            Height: =60
            Size: =14
            Text: ="You have " & CountRows(colDirtyIPP) & " unsaved IPP confirmation" & If(CountRows(colDirtyIPP) = 1, "", "s") & ". Leave anyway?"
            Visible: =ctxShowUnsavedIPPConfirm
            Width: =440
            X: =(Parent.Width - 440) / 2
            Y: =(Parent.Height - 200) / 2 + 30
      - btnIPPConfirmDiscard:
          Control: ModernButton@1.0.0
          Properties:
            Height: =44
            OnSelect: |
              =Clear(colDirtyIPP); UpdateContext({ ctxShowUnsavedIPPConfirm: false }); Navigate(scrLanding, ScreenTransition.Fade)
            Text: ="Discard changes"
            Visible: =ctxShowUnsavedIPPConfirm
            Width: =180
            X: =(Parent.Width - 460) / 2 + 30
            Y: =(Parent.Height - 200) / 2 + 120
      - btnIPPConfirmCancel:
          Control: ModernButton@1.0.0
          Properties:
            Height: =44
            OnSelect: |
              =UpdateContext({ ctxShowUnsavedIPPConfirm: false })
            Text: ="Keep editing"
            Visible: =ctxShowUnsavedIPPConfirm
            Width: =180
            X: =(Parent.Width - 460) / 2 + 250
            Y: =(Parent.Height - 200) / 2 + 120
