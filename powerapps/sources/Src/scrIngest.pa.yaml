Screens:
  scrIngest:
    Properties:
      Fill: =RGBA(0, 146, 201, 1)
    Children:
      - recContentPanelIngest:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height - 100
            Width: =Parent.Width - 40
            X: =20
            Y: =80
      - icoBackIngest:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =40
            Icon: =Icon.ChevronLeft
            OnSelect: =Navigate(scrLanding, ScreenTransition.Fade)
            Width: =40
            X: =20
            Y: =20
      - lblIngestTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Lato Black'
            Height: =36
            Size: =16
            Text: ="PowerSchool Data Ingest"
            Width: =800
            X: =80
            Y: =20
      - lblIngestPlaceholder:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(120, 120, 120, 1)
            Font: =Font.Lato
            Size: =14
            Text: |
              ="Upload screen build in progress. Pending: Power Automate upload flow."
            Width: =800
            X: =200
            Y: =220
