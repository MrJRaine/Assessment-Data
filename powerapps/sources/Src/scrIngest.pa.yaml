Screens:
  scrIngest:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
    Children:
      - icoBackIngest:
          Control: ModernIcon@1.1.0
          Properties:
            Height: =40
            Icon: ="ArrowLeft"
            OnSelect: =Navigate(scrLanding, ScreenTransition.Fade)
            Width: =40
            X: =20
            Y: =20
      - lblIngestTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(50, 49, 48, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =36
            Size: =16
            Text: ="PowerSchool Data Ingest"
            Width: =800
            X: =80
            Y: =20
      - lblIngestPlaceholder:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(120, 120, 120, 1)
            Font: =Font.'Segoe UI'
            Size: =14
            Text: |
              ="Upload screen build in progress. Pending: Power Automate upload flow."
            Width: =800
            X: =200
            Y: =220
