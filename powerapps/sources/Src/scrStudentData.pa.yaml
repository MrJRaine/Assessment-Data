Screens:
  scrStudentData:
    Properties:
      Fill: =RGBA(0, 146, 201, 1)
      LoadingSpinnerColor: =RGBA(255, 255, 255, 1)
    Children:
      - btnBackToLanding:
          Control: ModernButton@1.0.0
          Properties:
            OnSelect: =Navigate(scrLanding, ScreenTransition.Fade)
            Text: ="← Back to Landing (Phase 5+ placeholder)"
            X: =40
            Y: =40
