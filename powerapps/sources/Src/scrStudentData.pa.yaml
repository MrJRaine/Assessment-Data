            Visible: =gblCohortLoaded And gblFiltersExpanded
            Width: =110
            X: =674
            Y: =88
      - cmbFltIndigenous:
          Control: ModernCombobox@1.1.0
          Properties:
            DefaultSelectedItems: |
              =Table({Value: "All"})
            Height: =40
            ItemDisplayText: =ThisItem.Value
            Items: =colYesNoOptions
            OnChange: =Set(gblFltIndigenous, Self.Selected.Value); Select(btnRefreshCharts)
            SelectMultiple: =false
            Visible: =gblCohortLoaded And gblFiltersExpanded
            Width: =130
            X: =674
            Y: =118
      - lblFltHomeroom:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =10
            Text: ="Homeroom"
            Visible: =gblCohortLoaded And gblFiltersExpanded
            Width: =140
            X: =40
            Y: =166
      - cmbFltHomeroom:
