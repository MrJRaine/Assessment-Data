            Width: =160
            X: =720
            Y: =116
      - btnResetFilters:
          Control: ModernButton@1.0.0
          Properties:
            Height: =40
            OnSelect: |
              =Reset(cmbFltGrade);
              Reset(cmbFltGender);
              Reset(cmbFltAfrican);
              Reset(cmbFltIndigenous);
              Set(gblFltGrade, "All");
              Set(gblFltGender, "All");
              Set(gblFltAfrican, "All");
              Set(gblFltIndigenous, "All")
            Text: ="Reset Filters"
            Visible: =gblCohortLoaded
            Width: =140
            X: =900
            Y: =116
      - lblHdrStudent:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(96, 94, 92, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =11
            Text: ="Student"
            Visible: =gblCohortLoaded
            Width: =200
            X: =72
            Y: =440
      - lblHdrGrade:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(96, 94, 92, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =11
            Text: ="Grade"
            Visible: =gblCohortLoaded
            Width: =80
            X: =282
            Y: =440
      - lblHdrProgram:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(96, 94, 92, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =11
            Text: ="Program"
            Visible: =gblCohortLoaded
            Width: =180
            X: =372
            Y: =440
      - lblHdrSchool:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(96, 94, 92, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =11
            Text: ="School"
            Visible: =gblCohortLoaded
            Width: =100
            X: =562
            Y: =440
      - lblHdrLevel:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(96, 94, 92, 1)
