            Y: =440
      - galStudents:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Height: =Parent.Height - 552
            Items: |
              =Filter(
                colStudentCohort,
                (gblFltGrade = "All" Or Grade = gblFltGrade),
                (gblFltGender = "All" Or Gender = gblFltGender),
                (gblFltAfrican = "All"
                  Or (gblFltAfrican = "Yes" And SelfIDAfrican = true)
                  Or (gblFltAfrican = "No"  And SelfIDAfrican = false)),
                (gblFltIndigenous = "All"
                  Or (gblFltIndigenous = "Yes" And SelfIDIndigenous = true)
                  Or (gblFltIndigenous = "No"  And SelfIDIndigenous = false))
              )
            OnSelect: |
              =Set(gblSelectedStudent, ThisItem);
              Navigate(scrStudentDetail, ScreenTransition.Fade)
            TemplateSize: =56
            Visible: =gblCohortLoaded
            Width: =Parent.Width - 80
            X: =40
            Y: =462
          Children:
            - recStudentRowBg:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: |
                    =If(
                      IsBlank(ThisItem.MostRecentAchievementHexColor),
                      RGBA(0, 0, 0, 0),
                      ColorFade(ColorValue(ThisItem.MostRecentAchievementHexColor), 0.4)
                    )
                  Height: =Parent.TemplateHeight - 4
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth - 16
                  X: =8
                  Y: =2
            - lblCohortStudentName:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(32, 31, 30, 1)
                  Font: =Font.Lato
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.TemplateHeight - 4
                  OnSelect: =Select(Parent)
                  PaddingLeft: =12
                  Size: =12
                  Text: =ThisItem.FullName
                  Width: =200
                  X: =24
                  Y: =2
            - lblStudentGrade:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(32, 31, 30, 1)
                  Font: =Font.Lato
                  Height: =Parent.TemplateHeight - 4
                  OnSelect: =Select(Parent)
                  Size: =12
                  Text: =ThisItem.Grade
                  Width: =80
                  X: =234
                  Y: =2
            - lblStudentProgram:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(32, 31, 30, 1)
                  Font: =Font.Lato
                  Height: =Parent.TemplateHeight - 4
                  OnSelect: =Select(Parent)
                  Size: =12
