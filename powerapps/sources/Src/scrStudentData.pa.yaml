Screens:
  scrStudentData:
    Properties:
      Fill: =RGBA(0, 146, 201, 1)
      LoadingSpinnerColor: =RGBA(255, 255, 255, 1)
      OnVisible: |
        =Set(gblCohortLoaded, false);
        ClearCollect(colAchievementLevels, DimAchievementLevel);
        Refresh(vw_StudentCohort);
        Refresh(vw_StudentAssessmentHistory);
        ClearCollect(colStudentCohort, SortByColumns(vw_StudentCohort, "LastName", SortOrder.Ascending, "FirstName", SortOrder.Ascending));
        ClearCollect(colStudentHistory, vw_StudentAssessmentHistory);
        ClearCollect(colSchoolYearOptions, {Value: "2025-2026"}, {Value: "2024-2025"});
        ClearCollect(colGradeOptions, {Value: "All"});
        Collect(colGradeOptions, RenameColumns(ShowColumns(Sort(GroupBy(colStudentCohort, Grade, GradeOrder, _g), GradeOrder, SortOrder.Ascending), Grade), Grade, Value));
        ClearCollect(colGenderOptions, {Value: "All"});
        Collect(colGenderOptions, Sort(ShowColumns(RenameColumns(GroupBy(colStudentCohort, Gender, _g), Gender, Value), Value), Value, SortOrder.Ascending));
        ClearCollect(colYesNoOptions, {Value: "All"}, {Value: "Yes"}, {Value: "No"});
        Set(gblSelectedSchoolYear, "2025-2026");
        Set(gblFltGrade, "All");
        Set(gblFltGender, "All");
        Set(gblFltAfrican, "All");
        Set(gblFltIndigenous, "All");
        ClearCollect(colPieData,
          ForAll(
            SortByColumns(Filter(colAchievementLevels, ActiveFlag = true), "DisplayOrder", SortOrder.Ascending) As lv,
            {
              Category: lv.AchievementLevelName,
              Count: CountIf(colStudentCohort, IsChartEligibleReading = true And MostRecentAchievementLevelCode = lv.AchievementLevelCode)
            }
          )
        );
        ClearCollect(colBarData,
          ForAll(
            GroupBy(
              Filter(colStudentHistory, WindowSchoolYear = gblSelectedSchoolYear And IsChartEligibleReading = true),
              WindowName, _g
            ) As w,
            { Window: w.WindowName, Count: CountRows(w._g) }
          )
        );
        Set(gblCohortLoaded, true)
    Children:
      - recContentPanel:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height - 100
            Width: =Parent.Width - 40
            X: =20
            Y: =80
      - icoCohortBack:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =40
            Icon: =Icon.ChevronLeft
            OnSelect: =Navigate(scrLanding, ScreenTransition.Fade)
            Width: =40
            X: =20
            Y: =20
      - lblCohortTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Lato Black'
            Height: =36
            Size: =16
            Text: ="Student Data"
            Width: =400
            X: =80
            Y: =20
      - lblCohortLoading:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(96, 94, 92, 1)
            Font: =Font.Lato
            Size: =14
            Text: ="Loading student data…"
            Visible: =!gblCohortLoaded
            Width: =Parent.Width - 80
            X: =40
            Y: =400
      - lblFltSchoolYear:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(96, 94, 92, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =10
            Text: ="School Year"
            Visible: =gblCohortLoaded
            Width: =160
            X: =40
            Y: =96
      - cmbFltSchoolYear:
          Control: ModernCombobox@1.1.0
          Properties:
            DefaultSelectedItems: |
              =Table({Value: gblSelectedSchoolYear})
            Height: =40
            InputTextPlaceholder: ="School year"
            ItemDisplayText: =ThisItem.Value
            Items: =colSchoolYearOptions
            OnChange: =Set(gblSelectedSchoolYear, Self.Selected.Value)
            SelectMultiple: =false
            Visible: =gblCohortLoaded
            Width: =160
            X: =40
            Y: =116
      - lblFltGrade:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(96, 94, 92, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =10
            Text: ="Grade"
            Visible: =gblCohortLoaded
            Width: =140
            X: =220
            Y: =96
      - cmbFltGrade:
          Control: ModernCombobox@1.1.0
          Properties:
            DefaultSelectedItems: |
              =Table({Value: "All"})
            Height: =40
            ItemDisplayText: =ThisItem.Value
            Items: =colGradeOptions
            OnChange: =Set(gblFltGrade, Self.Selected.Value)
