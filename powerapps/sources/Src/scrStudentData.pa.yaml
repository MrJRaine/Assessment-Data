            X: =540
            Y: =96
      - cmbFltAfrican:
          Control: ModernCombobox@1.1.0
          Properties:
            DefaultSelectedItems: |
              =Table({Value: "All"})
            Height: =40
            ItemDisplayText: =ThisItem.Value
            Items: =colYesNoOptions
            OnChange: =Set(gblFltAfrican, Self.Selected.Value)
            SelectMultiple: =false
            Visible: =gblCohortLoaded
            Width: =160
            X: =540
