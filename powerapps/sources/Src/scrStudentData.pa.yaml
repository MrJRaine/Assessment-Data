                  Width: =180
                  X: =324
                  Y: =2
            - lblStudentSchool:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(32, 31, 30, 1)
                  Font: =Font.Lato
                  Height: =Parent.TemplateHeight - 4
                  OnSelect: =Select(Parent)
                  Size: =12
                  Text: =ThisItem.SchoolID
                  Width: =100
                  X: =514
                  Y: =2
            - lblStudentLevel:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(32, 31, 30, 1)
                  Font: =Font.Lato
                  Height: =Parent.TemplateHeight - 4
                  OnSelect: =Select(Parent)
                  Size: =12
                  Text: =Coalesce(ThisItem.MostRecentLevelCode, "—")
                  Width: =120
                  X: =624
                  Y: =2
            - lblStudentDelta:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(32, 31, 30, 1)
                  Font: =Font.Lato
                  Height: =Parent.TemplateHeight - 4
                  OnSelect: =Select(Parent)
                  Size: =12
                  Text: |
                    =If(
                      IsBlank(ThisItem.MostRecentReadingDelta),
                      "—",
                      If(ThisItem.MostRecentReadingDelta > 0, "+", "") & ThisItem.MostRecentReadingDelta
                    )
                  Width: =100
                  X: =754
                  Y: =2
            - lblStudentAchievement:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(32, 31, 30, 1)
                  Font: =Font.'Lato Black'
                  Height: =Parent.TemplateHeight - 4
                  OnSelect: =Select(Parent)
                  Size: =12
                  Text: =Coalesce(ThisItem.MostRecentAchievementLevelName, "")
                  Width: =200
                  X: =864
                  Y: =2
            - icoStudentDrill:
                Control: Classic/Icon@2.5.0
                Properties:
                  Color: =RGBA(0, 146, 201, 1)
                  Height: =24
                  Icon: =Icon.ChevronRight
                  OnSelect: =Select(Parent)
                  Width: =24
                  X: =Parent.TemplateWidth - 48
                  Y: =Parent.TemplateHeight / 2 - 12
      - lblEmptyCohort:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(120, 120, 120, 1)
            Font: =Font.Lato
            Text: ="No students match the current filters."
            Visible: =gblCohortLoaded And CountRows(galStudents.AllItems) = 0
            Width: =Parent.Width - 80
            X: =40
            Y: =500
      - Title2:
          Control: Label@2.5.1
          Group: CompositePieChart1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(50, 49, 48, 1)
            DisabledColor: =RGBA(161, 159, 157, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =12
            Text: ="Current Achievement Distribution"
            Visible: =gblCohortLoaded
            Width: =620
            X: =40
            Y: =178
      - PieChart1:
          Control: PieChart@2.3.0
          Group: CompositePieChart1
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
            Color: =RGBA(50, 49, 48, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            Font: =Font.Lato
            Height: =210
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            ItemColorSet: =[RGBA(214, 69, 80, 1), RGBA(230, 108, 55, 1), RGBA(26, 171, 64, 1), RGBA(17, 141, 255, 1)]
            Items: =colPieData
            Items.Labels: =Category
            Items.Series: =Count
            PressedBorderColor: =RGBA(0, 0, 0, 0)
