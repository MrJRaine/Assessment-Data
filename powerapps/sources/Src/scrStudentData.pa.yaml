      - lblEmptyCohort:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            Text: ="No students match the current filters."
            Visible: =gblCohortLoaded And CountRows(colCohortFiltered) = 0
            Width: =Parent.Width / 2 - 80
            X: =40
            Y: =Parent.Height / 2 - 80
      # PieChart@2.3.0 renders the pie at only ~58% of its control box (fixed
      # internal padding, no property to change it). To get a big VISIBLE donut we
      # OVERSIZE the box well beyond the donut and let the empty padding overlap
      # neighbours that draw on top (Title2 moved below this control; bar chart is
      # already later in z-order). Box is centred in the title->bar band.
      - PieChart1:
          Control: PieChart@2.3.0
          Group: CompositePieChart1
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
            Color: =RGBA(74, 91, 100, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            Font: =Font.Lato
            Height: =Min(Parent.Height - 340, Parent.Width / 2 - 60)
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            ItemColorSet: =gblAchColors
            Items: =colPieData
            Items.Labels: =SliceLabel
            Items.Series: =Count
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            Size: =12
            Visible: =gblCohortLoaded
            Width: =Min(Parent.Height - 340, Parent.Width / 2 - 60)
            X: =0.75 * Parent.Width - 150 - 0.5 * Min(Parent.Height - 340, Parent.Width / 2 - 60)
            Y: =Parent.Height / 2 + 18 - If(gblFiltersExpanded, 0, 92) - Min(Parent.Height - 340, Parent.Width / 2 - 60) / 2
      # Donut hole overlay — white Circle centred on the box centre (= the visible
      # pie centre, since the pie self-centres in its box).
      - recPieDonutHole:
          Control: Circle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Min(PieChart1.Width, PieChart1.Height) * 0.28
            Visible: =gblCohortLoaded
            Width: =Min(PieChart1.Width, PieChart1.Height) * 0.28
            X: =PieChart1.X + PieChart1.Width / 2 - Self.Width / 2
            Y: =PieChart1.Y + PieChart1.Height / 2 - Self.Height / 2
      - lblPieCenterTotal:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(24, 43, 52, 1)
            Font: =Font.'Lato Black'
            Height: =28
            Size: =18
            Text: =gblPieTotal
            Visible: =gblCohortLoaded
            Width: =recPieDonutHole.Width
            X: =recPieDonutHole.X
            Y: =recPieDonutHole.Y + recPieDonutHole.Height / 2 - 20
      - lblPieCenterLabel:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            Height: =14
            Size: =8
            Text: ="ASSESSED"
            Visible: =gblCohortLoaded
            Width: =recPieDonutHole.Width
            X: =recPieDonutHole.X
            Y: =recPieDonutHole.Y + recPieDonutHole.Height / 2 + 6
      # Title sits AFTER the pie so the oversized box's transparent top padding
      # can't hide it. Positioned above the visible donut, below the filter strip.
      - Title2:
          Control: Label@2.5.1
          Group: CompositePieChart1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(24, 43, 52, 1)
            DisabledColor: =RGBA(161, 159, 157, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Bold
            Height: =24
            Size: =14
            Text: ="Current Achievement Distribution"
            Visible: =gblCohortLoaded
            Width: =Parent.Width / 2 - 10
            X: =Parent.Width / 2 - 30
            Y: =244 - If(gblFiltersExpanded, 0, 92)
      # Custom legend — replaces native Legend1 so each row carries percent + count.
      - galPieLegend:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Height: =128
            Items: =Sort(colPieData, Code, SortOrder.Descending)
            ShowNavigation: =false
            TemplatePadding: =0
            TemplateSize: =30
            Visible: =gblCohortLoaded
            Width: =220
            X: =PieChart1.X + PieChart1.Width * 0.8 + 16
            Y: =PieChart1.Y + PieChart1.Height / 2 - 64
          Children:
            - lblLegendPct:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =RGBA(24, 43, 52, 1)
                  Font: =Font.Lato
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.TemplateHeight
                  PaddingLeft: =0
                  PaddingRight: =6
                  Size: =11
                  Text: =ThisItem.PercentLabel
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =54
                  X: =0
                  Y: =0
            - recLegendSwatch:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =ColorValue(ThisItem.Hex)
                  Height: =12
                  Width: =12
                  X: =64
                  Y: =Parent.TemplateHeight / 2 - 6
            - lblLegendName:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(24, 43, 52, 1)
                  Font: =Font.Lato
                  Height: =Parent.TemplateHeight
                  Size: =11
                  Text: =ThisItem.Category & " · " & ThisItem.Count
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.TemplateWidth - 86
                  X: =82
                  Y: =0
      - Title3:
          Control: Label@2.5.1
          Group: CompositeColumnChart1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(24, 43, 52, 1)
            DisabledColor: =RGBA(161, 159, 157, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Bold
            Height: =24
