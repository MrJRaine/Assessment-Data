# ── Direction B restyle (Edge-to-Edge) ──────────────────────────────────────
# Visual restyle ported from handoff/powerapps_yaml/scrStudentData.pa.yaml.
# UNTOUCHED: OnVisible chart build, btnRefreshCharts core logic, gallery OnSelect,
# chart Items/ItemColorSet/Group, Visible bindings on the chart cluster.
#
# Tint: recStudentRowBg.Fill reads MostRecentAchievementHexColorTint (HexColorTint
# SQL deployed 2026-06-10). gblAchColors still reads the SOLID HexColor.
#
# Filters (Pack A + collapsible upgrade 2026-06-10):
#   - All filtering is centralised in colCohortFiltered (built in btnRefreshCharts).
#     The gallery, charts, empty-state and match-count all read from it.
#   - Multi-select filters: Homeroom, Program, School (analyst-only), Achievement.
#     Stable lists built from the full cohort; membership tested with `in`.
#   - Collapsible filter bar: gblFiltersExpanded gates recFilterBar + every filter
#     label/combo. When collapsed the hint/headers/gallery slide up 184px; the
#     pie/bar are bottom-anchored so they stay put. Match count + Reset + the
#     Show/Hide toggle live in the blue header, always visible.
#
# DELIBERATE DEVIATIONS from the handoff:
#   - btnResetFilters / btnFilterToggle: Classic/Button@2.2.0 (modern buttons throw
#     PA2108 when given Fill). btnResetFilters = white pill on blue; toggle = ghost.
#   - Donut + rich legend: PieChart slice labels removed; white Circle donut hole +
#     gblPieTotal centre; native Legend replaced by galPieLegend (percent + count).
#
# Token map: brand RGBA(0,146,201) · brand-ink RGBA(3,108,146) · ink RGBA(24,43,52)
#   · ink-2 RGBA(74,91,100) · ink-3 RGBA(110,126,134) · line RGBA(228,234,237)
#   · row-line RGBA(212,221,226) · strip RGBA(244,247,249)
# ─────────────────────────────────────────────────────────────────────────────
Screens:
  scrStudentData:
    Properties:
      Fill: =RGBA(0, 146, 201, 1)
      LoadingSpinnerColor: =RGBA(255, 255, 255, 1)
      OnVisible: |
        =Set(gblCohortLoaded, false);
        Clear(colStudentCohort);
        Clear(colStudentHistory);
        ClearCollect(colAchievementLevels, DimAchievementLevel);
        Set(gblAchColors, [
          ColorValue(LookUp(colAchievementLevels, AchievementLevelCode = 1).HexColor),
          ColorValue(LookUp(colAchievementLevels, AchievementLevelCode = 2).HexColor),
          ColorValue(LookUp(colAchievementLevels, AchievementLevelCode = 3).HexColor),
          ColorValue(LookUp(colAchievementLevels, AchievementLevelCode = 4).HexColor)
        ]);
        Refresh(vw_StudentCohort);
        Refresh(vw_StudentAssessmentHistory);
        ClearCollect(colStudentCohort, SortByColumns(vw_StudentCohort, "LastName", SortOrder.Ascending, "FirstName", SortOrder.Ascending));
        ClearCollect(colStudentHistory, vw_StudentAssessmentHistory);
        ClearCollect(colSchoolYearOptions, {Value: "2025-2026"}, {Value: "2024-2025"});
        ClearCollect(colGradeOptions, Sort(RenameColumns(GroupBy(colStudentCohort, Grade, GradeOrder, _g), GradeOrder, Ord, Grade, Value), Ord, SortOrder.Ascending));
        ClearCollect(colGenderOptions, {Value: "All"});
        Collect(colGenderOptions, Sort(ShowColumns(RenameColumns(GroupBy(colStudentCohort, Gender, _g), Gender, Value), Value), Value, SortOrder.Ascending));
        ClearCollect(colYesNoOptions, {Value: "All"}, {Value: "Yes"}, {Value: "No"});
        ClearCollect(colHomeroomOptions, Sort(Filter(ShowColumns(RenameColumns(GroupBy(colStudentCohort, Homeroom, _g), Homeroom, Value), Value), Not(IsBlank(Value))), Value, SortOrder.Ascending));
        ClearCollect(colProgramOptions, Sort(Filter(ShowColumns(RenameColumns(GroupBy(colStudentCohort, ProgramFamily, _g), ProgramFamily, Value), Value), Not(IsBlank(Value))), Value, SortOrder.Ascending));
        ClearCollect(colSchoolOptions, Sort(ShowColumns(GroupBy(colStudentCohort, SchoolID, SchoolName, SchoolAbbreviation, _g), SchoolID, SchoolName, SchoolAbbreviation), SchoolName, SortOrder.Ascending));
        ClearCollect(colAchievementOptions, Sort(Filter(colAchievementLevels, ActiveFlag = true), AchievementLevelCode, SortOrder.Ascending));
        Set(gblSelectedSchoolYear, Coalesce(gblSelectedSchoolYear, "2025-2026"));
        Set(gblFltGradeMinOrd, Coalesce(gblFltGradeMinOrd, Min(colStudentCohort, GradeOrder)));
        Set(gblFltGradeMaxOrd, Coalesce(gblFltGradeMaxOrd, Max(colStudentCohort, GradeOrder)));
        Set(gblFltGender, Coalesce(gblFltGender, "All"));
        Set(gblFltAfrican, Coalesce(gblFltAfrican, "All"));
        Set(gblFltIndigenous, Coalesce(gblFltIndigenous, "All"));
        Set(gblFltHomerooms, Filter(colHomeroomOptions, false));
        Set(gblFltPrograms, Filter(colProgramOptions, false));
        Set(gblFltSchools, Filter(colSchoolOptions, false));
        Set(gblFltAchievement, Filter(colAchievementOptions, false));
        Set(gblFiltersExpanded, Coalesce(gblFiltersExpanded, false));
        Select(btnRefreshCharts);
        Set(gblCohortLoaded, true)
    Children:
      - recContentPanel:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height - 52
            Width: =Parent.Width
            X: =0
            Y: =52
      - icoCohortBack:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =32
            Icon: =Icon.ChevronLeft
            OnSelect: =Navigate(scrLanding, ScreenTransition.Fade)
            Width: =32
            X: =16
            Y: =10
      - lblCohortTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Lato Black'
            Height: =32
            Size: =17
            Text: ="Student Data"
            Width: =400
            X: =56
            Y: =14
      - btnFilterToggle:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 0.6)
            BorderThickness: =1
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(255, 255, 255, 0)
            Font: =Font.Lato
            Height: =32
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(255, 255, 255, 0.15)
            OnSelect: =Set(gblFiltersExpanded, Not(gblFiltersExpanded))
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(255, 255, 255, 0.25)
            Size: =12
            Text: =If(gblFiltersExpanded, "Hide filters", "Show filters")
            Visible: =gblCohortLoaded
            Width: =112
            X: =Parent.Width - 470
            Y: =10
      - lblMatchCount:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =12
            Text: =CountRows(colCohortFiltered) & " students match"
            VerticalAlign: =VerticalAlign.Middle
            Visible: =gblCohortLoaded
            Width: =160
            X: =Parent.Width - 340
            Y: =10
      - btnResetFilters:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 0)
            BorderThickness: =1
            Color: =RGBA(3, 108, 146, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.Lato
            Height: =32
            HoverColor: =RGBA(3, 108, 146, 1)
            HoverFill: =RGBA(244, 247, 249, 1)
            OnSelect: |
              =Set(gblFltGradeMinOrd, Min(colStudentCohort, GradeOrder));
              Set(gblFltGradeMaxOrd, Max(colStudentCohort, GradeOrder));
              Set(gblFltGender, "All");
              Set(gblFltAfrican, "All");
              Set(gblFltIndigenous, "All");
              Set(gblFltHomerooms, Filter(colHomeroomOptions, false));
              Set(gblFltPrograms, Filter(colProgramOptions, false));
              Set(gblFltSchools, Filter(colSchoolOptions, false));
              Set(gblFltAchievement, Filter(colAchievementOptions, false));
              Reset(cmbFltGradeMin);
              Reset(cmbFltGradeMax);
              Reset(cmbFltGender);
              Reset(cmbFltAfrican);
              Reset(cmbFltIndigenous);
              Reset(cmbFltHomeroom);
              Reset(cmbFltProgram);
              Reset(cmbFltSchool);
              Reset(cmbFltAchievement);
              Select(btnRefreshCharts)
            PressedColor: =RGBA(3, 108, 146, 1)
            PressedFill: =RGBA(230, 244, 250, 1)
            Size: =12
            Text: ="Reset filters"
            Visible: =gblCohortLoaded
            Width: =140
            X: =Parent.Width - 156
            Y: =10
      - recFilterBar:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(228, 234, 237, 1)
            BorderThickness: =1
            Fill: =RGBA(244, 247, 249, 1)
            Height: =156
            Visible: =gblCohortLoaded And gblFiltersExpanded
            Width: =Parent.Width
            X: =0
            Y: =80
