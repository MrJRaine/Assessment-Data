            DefaultSelectedItems: |
              =Table({Value: "All"})
            Height: =40
            ItemDisplayText: =ThisItem.Value
            Items: =colGenderOptions
            OnChange: =Set(gblFltGender, Self.Selected.Value)
            SelectMultiple: =false
            Visible: =gblCohortLoaded
            Width: =140
            X: =380
            Y: =116
      - lblFltAfrican:
