      - galStudents:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Height: =Parent.Height - 545 + If(gblFiltersExpanded, 0, 184)
            Items: =colCohortFiltered
            OnSelect: |
              =Set(gblSelectedStudent, ThisItem);
              Navigate(scrStudentDetail, ScreenTransition.Fade)
            TemplateSize: =30
            Visible: =gblCohortLoaded
            Width: =Parent.Width / 2 - 80
            X: =40
            Y: =296 - If(gblFiltersExpanded, 0, 184)
          Children:
            - recStudentRowBg:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: |
                    =If(
                      IsBlank(ThisItem.MostRecentAchievementHexColorTint),
                      RGBA(0, 0, 0, 0),
                      ColorValue(ThisItem.MostRecentAchievementHexColorTint)
                    )
                  Height: =Parent.TemplateHeight - 1
