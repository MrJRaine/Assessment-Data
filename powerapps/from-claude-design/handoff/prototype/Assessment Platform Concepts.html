<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Assessment Platform — Concepts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assessment.css" />
  <style> html, body { margin: 0; height: 100%; background: #f0eee9; } </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="screens.js"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>

  <script type="text/babel">
    function Screen({ dir, kind }) {
      return (
        <div data-dir={dir} style={{ width: '100%', height: '100%' }}
          dangerouslySetInnerHTML={{ __html: window.SCREENS[kind]() }} />
      );
    }

    const A = 'A · Quiet Canvas';
    const B = 'B · Edge-to-Edge';

    function App() {
      return (
        <DesignCanvas>
          <DCSection id="flow" title="Direction B — committed" subtitle="Edge-to-Edge: slim cyan bar, white workspace fills the Teams pane. Full screen flow below.">
            <DCArtboard id="landing" label="Landing / hub" width={1180} height={620}><Screen dir="B" kind="landing" /></DCArtboard>
            <DCArtboard id="windows" label="Data Entry · window select" width={1180} height={720}><Screen dir="B" kind="windowSelect" /></DCArtboard>
            <DCArtboard id="groups" label="Data Entry · class select" width={1180} height={720}><Screen dir="B" kind="groupSelect" /></DCArtboard>
            <DCArtboard id="roster" label="Roster grid · data entry" width={1280} height={760}><Screen dir="B" kind="roster" /></DCArtboard>
          </DCSection>

          <DCSection id="analyze" title="View & analyze" subtitle="Cohort dashboard, single-student detail, and the IPP confirmation grid.">
            <DCArtboard id="cohort" label="Student Data · cohort" width={1280} height={800}><Screen dir="B" kind="cohort" /></DCArtboard>
            <DCArtboard id="detail" label="Student detail" width={1180} height={800}><Screen dir="B" kind="studentDetail" /></DCArtboard>
            <DCArtboard id="ipp" label="Student IPPs" width={1280} height={720}><Screen dir="B" kind="studentIPP" /></DCArtboard>
          </DCSection>

          <DCSection id="foundations" title="Design system" subtitle="Palette, achievement scale, type & component styles behind every screen.">
            <DCArtboard id="found" label="Foundations" width={1180} height={1180}><Screen dir="B" kind="foundations" /></DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
