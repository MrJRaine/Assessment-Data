# ── Direction B restyle ─────────────────────────────────────────────────────
# Visual only. Status text keeps its pending/confirm/Yes/No logic; only the colour
# literals are mapped to tokens. Save buttons drop the 💾 glyph. Subtitle split into
# a needs-confirmation pill + hint (presentation only — same count formula).
# Pills/cards are square (classic Label/Rectangle have no corner radius).
# Untouched: OnVisible, all OnSelect (incl. dbouspUpsertStudentIPP save), Visible,
# Collect/Remove/LookUp logic, Items, modal confirm flow.
# ─────────────────────────────────────────────────────────────────────────────
Screens:
  scrIPP:
    Properties:
      Fill: =RGBA(0, 146, 201, 1)
      LoadingSpinnerColor: =RGBA(255, 255, 255, 1)
      OnVisible: |
        =Set(gblIPPLoaded, false);
        ClearCollect(colDirtyIPP, { _SK: "", _Subj: "", _PF: "", IsIPP: false });
        Clear(colDirtyIPP);
        Clear(colRawIPP);
        Refresh(vw_StudentIPP);
        ClearCollect(colRawIPP,
            SortByColumns(
                vw_StudentIPP,
                "LastName",         SortOrder.Ascending,
                "FirstName",        SortOrder.Ascending,
                "Subject",          SortOrder.Ascending,
                "IPPProgramFamily", SortOrder.Ascending
            )
        );
        Set(gblIPPLoaded, true)
    Children:
      - recContentPanelIPP:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height - 52
            Width: =Parent.Width
            X: =0
            Y: =52
      - icoBackToLandingIPP:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =32
            Icon: =Icon.ChevronLeft
            OnSelect: |
              =If(CountRows(colDirtyIPP) > 0, UpdateContext({ ctxShowUnsavedIPPConfirm: true }), Navigate(scrLanding, ScreenTransition.Fade))
            Width: =32
            X: =16
            Y: =10
      - lblIPPTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Lato Black'
            Height: =32
            Size: =17
            Text: ="IPP Subject Confirmation"
            Width: =800
            X: =56
            Y: =14
      - btnSaveTopIPP:
          Control: ModernButton@1.0.0
          Properties:
            DisplayMode: =If(CountRows(colDirtyIPP) = 0, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(3, 108, 146, 1)
            Font: =Font.Lato
            Height: =32
            OnSelect: =Select(btnSaveBottomIPP)
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =13
            Text: |-
              ="Save " & CountRows(colDirtyIPP) & If(CountRows(colDirtyIPP) = 1, " change", " changes")
            Width: =200
            X: =Parent.Width - 216
            Y: =10
      - lblIPPNeedPill:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(178, 51, 71, 1)
            Fill: =RGBA(252, 237, 239, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =26
            PaddingBottom: =0
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =0
            Size: =11
            Text: |-
              =CountRows(Filter(colRawIPP, IsBlank(IsIPP))) & " of " & CountRows(colRawIPP) & " still need confirmation"
            VerticalAlign: =VerticalAlign.Middle
            Width: =280
            X: =24
            Y: =66
      - lblIPPSubtitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            Height: =26
            Size: =12
            Text: ="Confirm each IPP subject so assessment data is interpreted correctly."
            VerticalAlign: =VerticalAlign.Middle
            Width: =700
            X: =316
            Y: =66
      - lblIPPHdrName:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =11
            Text: ="Student"
            Width: =200
            X: =40
            Y: =104
      - lblIPPHdrGrade:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =11
            Text: ="Grade"
            Width: =60
            X: =250
            Y: =104
      - lblIPPHdrHR:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =11
            Text: ="Homeroom"
            Width: =100
            X: =320
            Y: =104
      - lblIPPHdrSubject:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =11
            Text: ="IPP Subject"
            Width: =180
            X: =430
            Y: =104
      - lblIPPHdrState:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =11
            Text: ="Status"
            Width: =160
            X: =620
            Y: =104
      - lblIPPHdrAction:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =11
            Text: ="Action"
            Width: =400
            X: =790
            Y: =104
      - galStudentsIPP:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(228, 234, 237, 1)
            Height: =Parent.Height - Self.Y - 80
            Items: =colRawIPP
            TemplateSize: =48
            Visible: =gblIPPLoaded
            Width: =Parent.Width - 40
            X: =20
            Y: =132
          Children:
            - Image1IPP:
                Control: Image@2.2.3
                Properties:
                  Height: =1
                  Visible: =false
                  Width: =1
            - lblIPPStudentName:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(24, 43, 52, 1)
                  Font: =Font.Lato
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  PaddingLeft: =20
                  Size: =13
                  Text: =ThisItem.LastName & ", " & ThisItem.FirstName
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =200
                  X: =20
                  Y: =0
            - lblIPPStudentGrade:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(74, 91, 100, 1)
                  Font: =Font.Lato
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  Size: =13
                  Text: =ThisItem.Grade
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =60
                  X: =230
                  Y: =0
            - lblIPPStudentHomeroom:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(74, 91, 100, 1)
                  Font: =Font.Lato
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  Size: =13
                  Text: =Coalesce(ThisItem.Homeroom, "—")
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =100
                  X: =300
                  Y: =0
            - lblIPPSubjectLabel:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(74, 91, 100, 1)
                  Font: =Font.Lato
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  Size: =13
                  Text: |
                    =If(ThisItem.IPPProgramFamily = "French Immersion", "French", "English") & " " & ThisItem.Subject
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =180
                  X: =410
                  Y: =0
            - lblIPPState:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Left
                  Color: |
                    =With({pending: LookUp(colDirtyIPP, _SK = ThisItem.StudentKey And _Subj = ThisItem.Subject And _PF = ThisItem.IPPProgramFamily)},
                        If(!IsBlank(pending), RGBA(3, 108, 146, 1),
                            IsBlank(ThisItem.IsIPP), RGBA(178, 51, 71, 1),
                            ThisItem.IsIPP, RGBA(34, 106, 74, 1),
                            RGBA(110, 126, 134, 1))
                    )
                  Font: =Font.Lato
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  Size: =13
                  Text: |
                    =With({pending: LookUp(colDirtyIPP, _SK = ThisItem.StudentKey And _Subj = ThisItem.Subject And _PF = ThisItem.IPPProgramFamily)},
                        If(!IsBlank(pending), If(pending.IsIPP, "Yes (pending)", "No (pending)"),
                            IsBlank(ThisItem.IsIPP), "Needs confirmation",
                            ThisItem.IsIPP, "Yes (IPP)",
                            "No"
                        )
                    )
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =160
                  X: =600
                  Y: =0
            - btnIPPYes:
                Control: ModernButton@1.0.0
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  Fill: =RGBA(0, 146, 201, 1)
                  Font: =Font.Lato
                  Height: =36
                  OnSelect: |
                    =Remove(colDirtyIPP,
                        LookUp(colDirtyIPP,
                            _SK = ThisItem.StudentKey And
                            _Subj = ThisItem.Subject And
                            _PF = ThisItem.IPPProgramFamily
                        )
                    );
                    Collect(colDirtyIPP, {
                        _SK:   ThisItem.StudentKey,
                        _Subj: ThisItem.Subject,
                        _PF:   ThisItem.IPPProgramFamily,
                        IsIPP: true
                    })
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =12
                  Text: ="Yes (IPP)"
                  Visible: =IsBlank(ThisItem.IsIPP)
                  Width: =110
                  X: =770
                  Y: =(Parent.TemplateHeight - Self.Height) / 2
            - btnIPPNo:
                Control: ModernButton@1.0.0
                Properties:
                  BorderColor: =RGBA(228, 234, 237, 1)
                  BorderThickness: =1
                  Color: =RGBA(3, 108, 146, 1)
                  Fill: =RGBA(255, 255, 255, 1)
                  Font: =Font.Lato
                  Height: =36
                  OnSelect: |
                    =Remove(colDirtyIPP,
                        LookUp(colDirtyIPP,
                            _SK = ThisItem.StudentKey And
                            _Subj = ThisItem.Subject And
                            _PF = ThisItem.IPPProgramFamily
                        )
                    );
                    Collect(colDirtyIPP, {
                        _SK:   ThisItem.StudentKey,
                        _Subj: ThisItem.Subject,
                        _PF:   ThisItem.IPPProgramFamily,
                        IsIPP: false
                    })
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =12
                  Text: ="No"
                  Visible: =IsBlank(ThisItem.IsIPP)
                  Width: =90
                  X: =888
                  Y: =(Parent.TemplateHeight - Self.Height) / 2
            - icoIPPDirty:
                Control: Classic/Icon@2.5.0
                Properties:
                  Color: =RGBA(34, 106, 74, 1)
                  Height: =24
                  Icon: =Icon.Check
                  OnSelect: =Select(Parent)
                  Visible: |
                    =!IsBlank(LookUp(colDirtyIPP, _SK = ThisItem.StudentKey And _Subj = ThisItem.Subject And _PF = ThisItem.IPPProgramFamily))
                  Width: =24
                  X: =1040
                  Y: =(Parent.TemplateHeight - Self.Height) / 2
            - NextArrowIPP:
                Control: Classic/Icon@2.5.0
                Properties:
                  Height: =1
                  Icon: =Icon.ChevronRight
                  OnSelect: =Select(Parent)
                  Visible: =false
                  Width: =1
            - SeparatorIPP:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(212, 221, 226, 1)
                  Height: =1
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - Self.Height
            - SelectionBarIPP:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 146, 201, 1)
                  Height: =1
                  OnSelect: =Select(Parent)
                  Visible: =false
                  Width: =1
      - lblLoadingIPP:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            Height: =40
            Size: =14
            Text: ="Loading IPP cells…"
            Visible: =Not(gblIPPLoaded)
            Width: =Parent.Width - 48
            X: =24
            Y: =(Parent.Height - Self.Height) / 2
      - lblEmptyIPP:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            Height: =40
            Size: =14
            Text: ="No IPP cells in your scope."
            Visible: =gblIPPLoaded And CountRows(colRawIPP) = 0
            Width: =Parent.Width - 48
            X: =24
            Y: =(Parent.Height - Self.Height) / 2
      - btnSaveBottomIPP:
          Control: ModernButton@1.0.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =If(CountRows(colDirtyIPP) = 0, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(0, 146, 201, 1)
            Font: =Font.Lato
            Height: =44
            OnSelect: |
              =ForAll(colDirtyIPP As d,
                  Assessment_Warehouse.dbouspUpsertStudentIPP({
                      StudentKey:    d._SK,
                      Subject:       d._Subj,
                      ProgramFamily: d._PF,
                      IsIPP:         If(d.IsIPP, 1, 0)
                  })
              );
              Notify("Saved " & CountRows(colDirtyIPP) & " IPP confirmation" & If(CountRows(colDirtyIPP) = 1, "", "s"), NotificationType.Success);
              Clear(colDirtyIPP);
              Set(gblIPPLoaded, false);
              Refresh(vw_StudentIPP);
              ClearCollect(colRawIPP,
                  SortByColumns(
                      vw_StudentIPP,
                      "LastName",         SortOrder.Ascending,
                      "FirstName",        SortOrder.Ascending,
                      "Subject",          SortOrder.Ascending,
                      "IPPProgramFamily", SortOrder.Ascending
                  )
              );
              Set(gblIPPLoaded, true);
              Reset(galStudentsIPP)
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =14
            Text: |-
              ="Save " & CountRows(colDirtyIPP) & If(CountRows(colDirtyIPP) = 1, " change", " changes")
            Width: =220
            X: =(Parent.Width - 220) / 2
            Y: =Parent.Height - 60
      - recIPPUnsavedOverlay:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0.4)
            Height: =Parent.Height
            Visible: =ctxShowUnsavedIPPConfirm
            Width: =Parent.Width
      - recIPPUnsavedModal:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(228, 234, 237, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =200
            Visible: =ctxShowUnsavedIPPConfirm
            Width: =460
            X: =(Parent.Width - 460) / 2
            Y: =(Parent.Height - 200) / 2
      - lblIPPUnsavedConfirmText:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(24, 43, 52, 1)
            Font: =Font.Lato
            Height: =60
            Size: =14
            Text: ="You have " & CountRows(colDirtyIPP) & " unsaved IPP confirmation" & If(CountRows(colDirtyIPP) = 1, "", "s") & ". Leave anyway?"
            Visible: =ctxShowUnsavedIPPConfirm
            Width: =440
            X: =(Parent.Width - 440) / 2
            Y: =(Parent.Height - 200) / 2 + 30
      - btnIPPConfirmDiscard:
          Control: ModernButton@1.0.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(0, 146, 201, 1)
            Font: =Font.Lato
            Height: =44
            OnSelect: |
              =Clear(colDirtyIPP); UpdateContext({ ctxShowUnsavedIPPConfirm: false }); Navigate(scrLanding, ScreenTransition.Fade)
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =13
            Text: ="Discard changes"
            Visible: =ctxShowUnsavedIPPConfirm
            Width: =180
            X: =(Parent.Width - 460) / 2 + 30
            Y: =(Parent.Height - 200) / 2 + 120
      - btnIPPConfirmCancel:
          Control: ModernButton@1.0.0
          Properties:
            BorderColor: =RGBA(228, 234, 237, 1)
            BorderThickness: =1
            Color: =RGBA(3, 108, 146, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.Lato
            Height: =44
            OnSelect: |
              =UpdateContext({ ctxShowUnsavedIPPConfirm: false })
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =13
            Text: ="Keep editing"
            Visible: =ctxShowUnsavedIPPConfirm
            Width: =180
            X: =(Parent.Width - 460) / 2 + 250
            Y: =(Parent.Height - 200) / 2 + 120
