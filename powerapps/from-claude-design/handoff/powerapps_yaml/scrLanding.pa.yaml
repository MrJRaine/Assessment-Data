# ── Direction B restyle ─────────────────────────────────────────────────────
# The 3 original Classic/Buttons are PRESERVED as the card background + tap target
# (their OnSelect navigation is unchanged). Icon + title + description + accent are
# added on top; each added control's OnSelect = Select(<the card button>) so the
# whole card is one tap target. NOTE: Classic Rectangle/Button has square corners —
# cards are square (no border radius is available on classic controls).
# Icon enums (Trending / Edit / DocumentWithContent) may need swapping for ones in
# your environment's Icon list.
# ─────────────────────────────────────────────────────────────────────────────
Screens:
  scrLanding:
    Properties:
      Fill: =RGBA(0, 146, 201, 1)
      LoadingSpinnerColor: =RGBA(255, 255, 255, 1)
    Children:
      - recContentPanelLanding:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height - 52
            Width: =Parent.Width
            X: =0
            Y: =52
      - lblLandingHeading:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Lato Black'
            Size: =17
            Text: ="Reading Assessment"
            Visible: =gblLandingLoaded
            Width: =500
            X: =24
            Y: =14
      - lblLandingWelcome:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            Size: =13
            Text: ="Welcome back, " & User().FullName
            Visible: =gblLandingLoaded
            Width: =Parent.Width - 48
            X: =24
            Y: =80
      # ── Card 1 · Student Data ──────────────────────────────────────────────
      - btnStudentData:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(228, 234, 237, 1)
            BorderThickness: =1
            Color: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.Lato
            Height: =220
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(244, 247, 249, 1)
            OnSelect: =Navigate(scrStudentData, ScreenTransition.Fade)
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(230, 244, 250, 1)
            Size: =1
            Text: =""
            Visible: =gblLandingLoaded
            Width: =(Parent.Width - 92) / 3
            X: =24
            Y: =136
      - recEdgeStudentData:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 146, 201, 1)
            Height: =btnStudentData.Height
            OnSelect: =Select(btnStudentData)
            Width: =4
            X: =btnStudentData.X
            Y: =btnStudentData.Y
      - icoStudentData:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(3, 108, 146, 1)
            Height: =40
            Icon: =Icon.Trending
            OnSelect: =Select(btnStudentData)
            Width: =40
            X: =btnStudentData.X + 28
            Y: =btnStudentData.Y + 28
      - lblStudentDataTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(24, 43, 52, 1)
            Font: =Font.'Lato Black'
            OnSelect: =Select(btnStudentData)
            Size: =19
            Text: ="Student Data"
            Width: =btnStudentData.Width - 56
            X: =btnStudentData.X + 28
            Y: =btnStudentData.Y + 80
      - lblStudentDataDesc:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            OnSelect: =Select(btnStudentData)
            Size: =12
            Text: ="Browse your students with summary charts, then open any student for their full assessment history and progress trend."
            Width: =btnStudentData.Width - 56
            X: =btnStudentData.X + 28
            Y: =btnStudentData.Y + 116
      - lblStudentDataGo:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(3, 108, 146, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Bold
            OnSelect: =Select(btnStudentData)
            Size: =12
            Text: ="View & analyze  ›"
            Width: =btnStudentData.Width - 56
            X: =btnStudentData.X + 28
            Y: =btnStudentData.Y + btnStudentData.Height - 36
      # ── Card 2 · Data Entry ────────────────────────────────────────────────
      - btnDataEntry:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(228, 234, 237, 1)
            BorderThickness: =1
            Color: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.Lato
            Height: =220
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(244, 247, 249, 1)
            OnSelect: =Navigate(scrWindowSelect, ScreenTransition.Fade)
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(230, 244, 250, 1)
            Size: =1
            Text: =""
            Visible: =gblLandingLoaded
            Width: =(Parent.Width - 92) / 3
            X: =btnStudentData.X + btnStudentData.Width + 22
            Y: =136
      - recEdgeDataEntry:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 146, 201, 1)
            Height: =btnDataEntry.Height
            OnSelect: =Select(btnDataEntry)
            Width: =4
            X: =btnDataEntry.X
            Y: =btnDataEntry.Y
      - icoDataEntry:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(3, 108, 146, 1)
            Height: =40
            Icon: =Icon.Edit
            OnSelect: =Select(btnDataEntry)
            Width: =40
            X: =btnDataEntry.X + 28
            Y: =btnDataEntry.Y + 28
      - lblDataEntryTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(24, 43, 52, 1)
            Font: =Font.'Lato Black'
            OnSelect: =Select(btnDataEntry)
            Size: =19
            Text: ="Data Entry"
            Width: =btnDataEntry.Width - 56
            X: =btnDataEntry.X + 28
            Y: =btnDataEntry.Y + 80
      - lblDataEntryDesc:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            OnSelect: =Select(btnDataEntry)
            Size: =12
            Text: ="Record reading levels for a class during an open assessment window. The roster grid lets you enter a whole class at once."
            Width: =btnDataEntry.Width - 56
            X: =btnDataEntry.X + 28
            Y: =btnDataEntry.Y + 116
      - lblDataEntryGo:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(3, 108, 146, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Bold
            OnSelect: =Select(btnDataEntry)
            Size: =12
            Text: ="Enter assessments  ›"
            Width: =btnDataEntry.Width - 56
            X: =btnDataEntry.X + 28
            Y: =btnDataEntry.Y + btnDataEntry.Height - 36
      # ── Card 3 · Student IPPs ──────────────────────────────────────────────
      - btnStudentIPPs:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(228, 234, 237, 1)
            BorderThickness: =1
            Color: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.Lato
            Height: =220
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(244, 247, 249, 1)
            OnSelect: =Navigate(scrIPP, ScreenTransition.Fade)
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(230, 244, 250, 1)
            Size: =1
            Text: =""
            Visible: =gblLandingLoaded
            Width: =(Parent.Width - 92) / 3
            X: =btnDataEntry.X + btnDataEntry.Width + 22
            Y: =136
      - recEdgeStudentIPPs:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 146, 201, 1)
            Height: =btnStudentIPPs.Height
            OnSelect: =Select(btnStudentIPPs)
            Width: =4
            X: =btnStudentIPPs.X
            Y: =btnStudentIPPs.Y
      - icoStudentIPPs:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(3, 108, 146, 1)
            Height: =40
            Icon: =Icon.DocumentWithContent
            OnSelect: =Select(btnStudentIPPs)
            Width: =40
            X: =btnStudentIPPs.X + 28
            Y: =btnStudentIPPs.Y + 28
      - lblStudentIPPsTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(24, 43, 52, 1)
            Font: =Font.'Lato Black'
            OnSelect: =Select(btnStudentIPPs)
            Size: =19
            Text: ="Student IPPs"
            Width: =btnStudentIPPs.Width - 56
            X: =btnStudentIPPs.X + 28
            Y: =btnStudentIPPs.Y + 80
      - lblStudentIPPsDesc:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            OnSelect: =Select(btnStudentIPPs)
            Size: =12
            Text: ="Confirm which students have an Individual Program Plan by subject, so assessment data is interpreted correctly."
            Width: =btnStudentIPPs.Width - 56
            X: =btnStudentIPPs.X + 28
            Y: =btnStudentIPPs.Y + 116
      - lblStudentIPPsGo:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(3, 108, 146, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Bold
            OnSelect: =Select(btnStudentIPPs)
            Size: =12
            Text: ="Confirm plans  ›"
            Width: =btnStudentIPPs.Width - 56
            X: =btnStudentIPPs.X + 28
            Y: =btnStudentIPPs.Y + btnStudentIPPs.Height - 36
      - lblLoadingLanding:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            Height: =80
            Size: =14
            Text: ="Loading…"
            Visible: =Not(gblLandingLoaded)
            Width: =Parent.Width - 80
            X: =40
            Y: =(Parent.Height - Self.Height) / 2
