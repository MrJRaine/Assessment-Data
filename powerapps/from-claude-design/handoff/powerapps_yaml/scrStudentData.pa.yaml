# ── Direction B restyle ─────────────────────────────────────────────────────
# Visual only, EXCEPT the approved tint swap on recStudentRowBg.Fill
# (MostRecentAchievementHexColorTint instead of ColorFade(...,0.4)).
# gblAchColors still reads the SOLID HexColor — correct for pie/bar series.
# ADDED: recFilterBar strip, recCohortRowLine divider. Self-ID labels use Char(10)
# to wrap to two lines. NOTE: PA combobox widths are fixed; for the mock's
# content-sized auto-wrapping filter row, wrap these in a horizontal layout
# container. Untouched: OnVisible, btnRefreshCharts build, all OnChange, gallery
# Items/OnSelect, chart Items/ItemColorSet/Group, Visible bindings.
# ─────────────────────────────────────────────────────────────────────────────
Screens:
  scrStudentData:
    Properties:
      Fill: =RGBA(0, 146, 201, 1)
      LoadingSpinnerColor: =RGBA(255, 255, 255, 1)
      OnVisible: |
        =Set(gblCohortLoaded, false);
        Clear(colStudentCohort);
        Clear(colStudentHistory);
        ClearCollect(colAchievementLevels, DimAchievementLevel);
        Set(gblAchColors, [
          ColorValue(LookUp(colAchievementLevels, AchievementLevelCode = 1).HexColor),
          ColorValue(LookUp(colAchievementLevels, AchievementLevelCode = 2).HexColor),
          ColorValue(LookUp(colAchievementLevels, AchievementLevelCode = 3).HexColor),
          ColorValue(LookUp(colAchievementLevels, AchievementLevelCode = 4).HexColor)
        ]);
        Refresh(vw_StudentCohort);
        Refresh(vw_StudentAssessmentHistory);
        ClearCollect(colStudentCohort, SortByColumns(vw_StudentCohort, "LastName", SortOrder.Ascending, "FirstName", SortOrder.Ascending));
        ClearCollect(colStudentHistory, vw_StudentAssessmentHistory);
        ClearCollect(colSchoolYearOptions, {Value: "2025-2026"}, {Value: "2024-2025"});
        ClearCollect(colGradeOptions, Sort(RenameColumns(GroupBy(colStudentCohort, Grade, GradeOrder, _g), GradeOrder, Ord, Grade, Value), Ord, SortOrder.Ascending));
        ClearCollect(colGenderOptions, {Value: "All"});
        Collect(colGenderOptions, Sort(ShowColumns(RenameColumns(GroupBy(colStudentCohort, Gender, _g), Gender, Value), Value), Value, SortOrder.Ascending));
        ClearCollect(colYesNoOptions, {Value: "All"}, {Value: "Yes"}, {Value: "No"});
        Set(gblSelectedSchoolYear, Coalesce(gblSelectedSchoolYear, "2025-2026"));
        Set(gblFltGradeMinOrd, Coalesce(gblFltGradeMinOrd, Min(colStudentCohort, GradeOrder)));
        Set(gblFltGradeMaxOrd, Coalesce(gblFltGradeMaxOrd, Max(colStudentCohort, GradeOrder)));
        Set(gblFltGender, Coalesce(gblFltGender, "All"));
        Set(gblFltAfrican, Coalesce(gblFltAfrican, "All"));
        Set(gblFltIndigenous, Coalesce(gblFltIndigenous, "All"));
        Select(btnRefreshCharts);
        Set(gblCohortLoaded, true)
    Children:
      - recContentPanel:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height - 52
            Width: =Parent.Width
            X: =0
            Y: =52
      - recFilterBar:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(228, 234, 237, 1)
            BorderThickness: =1
            Fill: =RGBA(244, 247, 249, 1)
            Height: =84
            Width: =Parent.Width
            X: =0
            Y: =80
      - icoCohortBack:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =32
            Icon: =Icon.ChevronLeft
            OnSelect: =Navigate(scrLanding, ScreenTransition.Fade)
            Width: =32
            X: =16
            Y: =10
      - lblCohortTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Lato Black'
            Height: =32
            Size: =17
            Text: ="Student Data"
            Width: =400
            X: =56
            Y: =14
      - lblCohortLoading:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            Size: =14
            Text: ="Loading student data…"
            Visible: =!gblCohortLoaded
            Width: =Parent.Width - 80
            X: =40
            Y: =400
      - lblFltSchoolYear:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =10
            Text: ="School Year"
            Visible: =gblCohortLoaded
            Width: =160
            X: =40
            Y: =96
      - cmbFltSchoolYear:
          Control: ModernCombobox@1.1.0
          Properties:
            DefaultSelectedItems: |
              =Table({Value: gblSelectedSchoolYear})
            Height: =40
            InputTextPlaceholder: ="School year"
            ItemDisplayText: =ThisItem.Value
            Items: =colSchoolYearOptions
            OnChange: =Set(gblSelectedSchoolYear, Self.Selected.Value)
            SelectMultiple: =false
            Visible: =gblCohortLoaded
            Width: =150
            X: =40
            Y: =118
      - lblFltGradeMin:
