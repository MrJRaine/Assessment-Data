            Y: =88
      - cmbFltAfrican:
          Control: ModernCombobox@1.1.0
          Properties:
            DefaultSelectedItems: |
              =Table({Value: "All"})
            Height: =40
            ItemDisplayText: =ThisItem.Value
            Items: =colYesNoOptions
            OnChange: =Set(gblFltAfrican, Self.Selected.Value); Select(btnRefreshCharts)
            SelectMultiple: =false
            Visible: =gblCohortLoaded
            Width: =110
            X: =552
            Y: =118
      - lblFltIndigenous:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(110, 126, 134, 1)
            Font: =Font.Lato
            FontWeight: =FontWeight.Semibold
            Height: =30
            Size: =10
            Text: ="Self-ID" & Char(10) & "Indigenous"
            Visible: =gblCohortLoaded
            Width: =110
            X: =674
            Y: =88
      - cmbFltIndigenous:
          Control: ModernCombobox@1.1.0
          Properties:
            DefaultSelectedItems: |
              =Table({Value: "All"})
            Height: =40
            ItemDisplayText: =ThisItem.Value
            Items: =colYesNoOptions
            OnChange: =Set(gblFltIndigenous, Self.Selected.Value); Select(btnRefreshCharts)
            SelectMultiple: =false
            Visible: =gblCohortLoaded
            Width: =130
            X: =674
            Y: =118
      - btnResetFilters:
          Control: ModernButton@1.0.0
          Properties:
            BorderColor: =RGBA(228, 234, 237, 1)
            BorderThickness: =1
            Color: =RGBA(3, 108, 146, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.Lato
            Height: =40
            OnSelect: |
              =Set(gblFltGradeMinOrd, Min(colStudentCohort, GradeOrder));
              Set(gblFltGradeMaxOrd, Max(colStudentCohort, GradeOrder));
              Set(gblFltGender, "All");
              Set(gblFltAfrican, "All");
              Set(gblFltIndigenous, "All");
              Reset(cmbFltGradeMin);
              Reset(cmbFltGradeMax);
              Reset(cmbFltGender);
              Reset(cmbFltAfrican);
              Reset(cmbFltIndigenous);
              Select(btnRefreshCharts)
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =13
            Text: ="Reset filters"
            Visible: =gblCohortLoaded
            Width: =140
            X: =Parent.Width - 164
            Y: =118
      - btnRefreshCharts:
          Control: ModernButton@1.0.0
          Properties:
            Height: =1
            OnSelect: |
              =ClearCollect(colChartFiltered,
                Filter(colStudentCohort,
                  IsChartEligibleReading = true,
                  GradeOrder >= gblFltGradeMinOrd,
                  GradeOrder <= gblFltGradeMaxOrd,
                  (gblFltGender = "All" Or Gender = gblFltGender),
                  (gblFltAfrican = "All" Or (gblFltAfrican = "Yes" And SelfIDAfrican = true) Or (gblFltAfrican = "No" And SelfIDAfrican = false)),
                  (gblFltIndigenous = "All" Or (gblFltIndigenous = "Yes" And SelfIDIndigenous = true) Or (gblFltIndigenous = "No" And SelfIDIndigenous = false))
                )
              );
              Set(gblPieTotal, CountIf(colChartFiltered, Not(IsBlank(MostRecentAchievementLevelCode))));
              ClearCollect(colPieData,
                ForAll(
                  SortByColumns(Filter(colAchievementLevels, ActiveFlag = true), "DisplayOrder", SortOrder.Ascending) As lv,
                  With({_c: CountIf(colChartFiltered, MostRecentAchievementLevelCode = lv.AchievementLevelCode)},
                    {
                      Category: lv.AchievementLevelName,
                      PercentLabel: If(gblPieTotal > 0, Text(_c * 100 / gblPieTotal, "0.0") & "%", "0.0%"),
                      Count: _c
                    }
                  )
                )
              );
              ClearCollect(colBarData,
                ForAll(Sequence(6) As idx,
                  With({_monthStart: DateAdd(Date(Year(Today()), Month(Today()), 1), idx.Value - 6, TimeUnit.Months)},
                    With({_nextMonthStart: DateAdd(_monthStart, 1, TimeUnit.Months)},
                      {
                        Month: Text(_monthStart, "mmm"),
                        MonthStart: _monthStart,
                        NotYetMeeting: CountIf(colChartFiltered, Not(IsBlank(MostRecentAssessmentDate)) And MostRecentAssessmentDate < _nextMonthStart And MostRecentAchievementLevelCode = 1),
                        Approaching:   CountIf(colChartFiltered, Not(IsBlank(MostRecentAssessmentDate)) And MostRecentAssessmentDate < _nextMonthStart And MostRecentAchievementLevelCode = 2),
                        Meeting:       CountIf(colChartFiltered, Not(IsBlank(MostRecentAssessmentDate)) And MostRecentAssessmentDate < _nextMonthStart And MostRecentAchievementLevelCode = 3),
                        Exceeding:     CountIf(colChartFiltered, Not(IsBlank(MostRecentAssessmentDate)) And MostRecentAssessmentDate < _nextMonthStart And MostRecentAchievementLevelCode = 4)
                      }
                    )
                  )
                )
              )
            Text: =""
            Visible: =false
            Width: =1
            X: =0
            Y: =0
