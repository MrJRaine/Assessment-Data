            Items: =colGradeOptions
            OnChange: =Set(gblFltGradeMaxOrd, Self.Selected.Ord); Select(btnRefreshCharts)
            SelectMultiple: =false
            Visible: =gblCohortLoaded
            Width: =96
            X: =306
            Y: =118
      - lblFltGender:
